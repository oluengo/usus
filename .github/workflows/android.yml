# Builds the Android app (APK) from the PWA.
# - Tag v* (e.g. v2.2.1, matching APP_VERSION), or a Release published on GitHub:
#   attaches the APK to the Release, with the notes from CHANGELOG.md.
# - Push to the beta branch: "Usus Beta", a separate app (io.github.oluengo.usus.beta) with its own data, version X.Y.Z-beta.N.
#   Published as the "Usus Beta" pre-release (tag usus-beta, replaced on every push) and kept in Artifacts.
# - Run manually: leaves the files in the run's "Artifacts".
# Signing: secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Without them a debug APK is built (installable, but it can't be updated with the signed version).
name: Android

on:
  push:
    branches: [beta]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USUS_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      USUS_BETA_N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Beta · app name
        if: env.USUS_BETA == '1'
        run: sed -i 's#<string name="app_name">Usus</string>#<string name="app_name">Usus Beta</string>#; s#<string name="title_activity_main">Usus</string>#<string name="title_activity_main">Usus Beta</string>#' android/app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare web and Android project
        run: |
          npm ci
          npm run sync

      - name: Version
        id: v
        run: |
          v="$(cat www/version.txt)"
          if [ "$USUS_BETA" = "1" ]; then echo "version=$v-beta.$USUS_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=usus-beta" >> "$GITHUB_OUTPUT"; else echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=usus" >> "$GITHUB_OUTPUT"; fi

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/usus.jks"
            echo "USUS_KEYSTORE=$RUNNER_TEMP/usus.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing key: building a debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (signed)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          USUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.apk"

      - name: Build (debug)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-debug.apk"

      - name: Certificate SHA-256 fingerprint
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/usus.jks"

      - name: APK permissions
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump permissions "$f" | tee dist/permisos.txt
          if grep -E "STORAGE|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS|ACCESS_NETWORK" dist/permisos.txt; then echo "::error::Unexpected permission"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        run: node scripts/notes.mjs "${{ steps.v.outputs.version }}" dist/firma-sha256.txt > "$RUNNER_TEMP/notas.md"

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Usus ${{ steps.v.outputs.version }}
          files: dist/*.apk
          body_path: ${{ runner.temp }}/notas.md

      # Beta: a single "Usus Beta" pre-release (tag usus-beta) rebuilt on every push; it doesn't count as the latest version.
      - name: Pre-release beta
        if: env.USUS_BETA == '1' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete usus-beta --cleanup-tag --yes || true
          gh release delete beta --cleanup-tag --yes || true
          printf '%s\n\n%s\n\n%s\n' "**Test version** ${{ steps.v.outputs.version }} · $(git log -1 --format=%s)" \
            "Installs as a separate app, \"Usus Beta\", with its own data: it doesn't touch the regular Usus. It may have bugs." \
            "Web beta: https://oluengo.github.io/usus/beta/ (data separate from the main web app)." > "$RUNNER_TEMP/beta.md"
          gh release create usus-beta dist/*.apk --prerelease --target "$GITHUB_SHA" --title "Usus Beta ${{ steps.v.outputs.version }}" --notes-file "$RUNNER_TEMP/beta.md"
