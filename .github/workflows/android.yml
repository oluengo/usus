# Compila la app Android (APK + AAB) a partir de la PWA.
# - Etiqueta v* (p. ej. v2.2.1, igual que APP_VERSION): crea la Release de GitHub con el APK y el AAB.
# - Lanzado a mano (Actions → Android → Run workflow): deja los archivos en "Artifacts" de la ejecución.
# Firma: secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Sin ellos se genera un APK de depuración (instalable, pero no actualizable con la versión firmada).
name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v6

      - name: Preparar web y proyecto Android
        run: |
          npm ci
          npm run sync

      - name: Versión
        id: v
        run: echo "version=$(cat www/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con APP_VERSION ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Clave de firma
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/usus.jks"
            echo "USUS_KEYSTORE=$RUNNER_TEMP/usus.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma: se genera un APK de depuración."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (firmado)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          USUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/usus-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/usus-${{ steps.v.outputs.version }}.aab"

      - name: Compilar (depuración)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/usus-${{ steps.v.outputs.version }}-debug.apk"

      - name: Huella SHA-256 del certificado
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/usus.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: usus-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

      - name: Release de GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Usus ${{ steps.v.outputs.version }}
          files: |
            dist/*.apk
            dist/*.aab
          body: |
            App Android de Usus ${{ steps.v.outputs.version }}. Instala el archivo `.apk` en el móvil (permite «instalar apps de origen desconocido»).
            Novedades: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            Android app for Usus ${{ steps.v.outputs.version }}. Install the `.apk` file on your phone (allow “install unknown apps”).
            What's new: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
