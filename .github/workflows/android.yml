# Compila la app Android (APK + AAB) a partir de la PWA.
# - Etiqueta v* (p. ej. v2.2.1, igual que APP_VERSION), o Release publicada desde la web de GitHub:
#   adjunta a la Release el APK, con las notas de CHANGELOG.md. El AAB queda en Artifacts.
# - Push a la rama beta: «Usus Beta», otra app (io.github.oluengo.usus.beta) con sus propios datos, versión X.Y.Z-beta.N.
#   Se publica como pre-release «Usus Beta» (etiqueta beta, se sustituye en cada push) y queda en Artifacts.
# - Lanzado a mano: deja los archivos en "Artifacts" de la ejecución.
# Firma: secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# Sin ellos se genera un APK de depuración (instalable, pero no actualizable con la versión firmada).
name: Android

on:
  push:
    branches: [beta]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USUS_BETA: ${{ github.ref == 'refs/heads/beta' && '1' || '' }}
      USUS_BETA_N: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Beta · nombre de la app
        if: env.USUS_BETA == '1'
        run: sed -i 's#<string name="app_name">Usus</string>#<string name="app_name">Usus Beta</string>#; s#<string name="title_activity_main">Usus</string>#<string name="title_activity_main">Usus Beta</string>#' android/app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v6

      - name: Preparar web y proyecto Android
        run: |
          npm ci
          npm run sync

      - name: Versión
        id: v
        run: |
          v="$(cat www/version.txt)"
          if [ "$USUS_BETA" = "1" ]; then echo "version=$v-beta.$USUS_BETA_N" >> "$GITHUB_OUTPUT"; echo "file=usus-beta" >> "$GITHUB_OUTPUT"; else echo "version=$v" >> "$GITHUB_OUTPUT"; echo "file=usus" >> "$GITHUB_OUTPUT"; fi

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.v.outputs.version }}" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con APP_VERSION ${{ steps.v.outputs.version }}"; exit 1
          fi

      - name: Clave de firma
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/usus.jks"
            echo "USUS_KEYSTORE=$RUNNER_TEMP/usus.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin clave de firma: se genera un APK de depuración."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (firmado)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          USUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          USUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          USUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}.aab"

      - name: Compilar (depuración)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-debug.apk"

      - name: Huella SHA-256 del certificado
        if: steps.key.outputs.signed == 'true'
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$f" | grep -i sha-256 | tee dist/firma-sha256.txt
          rm -f "$RUNNER_TEMP/usus.jks"

      - name: Permisos del APK
        run: |
          f=$(ls dist/*.apk); bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump permissions "$f" | tee dist/permisos.txt
          if grep -E "INTERNET|STORAGE|LOCATION|CAMERA|RECORD_AUDIO|CONTACTS" dist/permisos.txt; then echo "::error::Permiso no esperado"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.v.outputs.file }}-${{ steps.v.outputs.version }}-android
          path: dist/
          if-no-files-found: error

      - name: Notas de la versión
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        run: node scripts/notes.mjs "${{ steps.v.outputs.version }}" dist/firma-sha256.txt > "$RUNNER_TEMP/notas.md"

      # En la Release solo va el APK; el AAB (para Google Play) queda en Artifacts de la ejecución.
      - name: Release de GitHub
        if: startsWith(github.ref, 'refs/tags/v') && steps.key.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Usus ${{ steps.v.outputs.version }}
          files: dist/*.apk
          body_path: ${{ runner.temp }}/notas.md

      # Beta: una sola pre-release «Usus Beta» (etiqueta beta) que se rehace en cada push; no cuenta como última versión.
      - name: Pre-release beta
        if: env.USUS_BETA == '1' && steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag --yes || true
          printf '%s\n\n%s\n\n%s\n' "**Versión de pruebas** ${{ steps.v.outputs.version }} · $(git log -1 --format=%s)" \
            "Se instala como otra app, «Usus Beta», con sus propios datos: no toca la Usus normal. Puede tener fallos." \
            "Web beta: https://oluengo.github.io/usus/beta/ (datos aparte de la web principal)." > "$RUNNER_TEMP/beta.md"
          gh release create beta dist/*.apk --prerelease --target "$GITHUB_SHA" --title "Usus Beta ${{ steps.v.outputs.version }}" --notes-file "$RUNNER_TEMP/beta.md"
