# Comprueba las traducciones (i18n/*.po) en cada push a beta o main y en las propuestas de cambio:
# plantilla al día con index.html, huecos {n} iguales en todos los idiomas y cuántos textos faltan.
# Si alguien cambia textos en index.html sin actualizar la plantilla, falla: ejecuta «npm run i18n» y sube los cambios.
name: Textos

on:
  push:
    branches: [beta, main]
    paths: ["index.html", "i18n/**", "scripts/i18n.mjs"]
  pull_request:
    paths: ["index.html", "i18n/**", "scripts/i18n.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Plantilla al día
        run: |
          node scripts/i18n.mjs extract
          if ! git diff --quiet -- i18n/usus.pot; then
            echo "::error::i18n/usus.pot no está al día con index.html. Ejecuta: npm run i18n"; git diff --stat; exit 1
          fi
      - name: Traducciones
        run: node scripts/i18n.mjs check
