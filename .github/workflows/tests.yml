# Automated app tests (Playwright, phone-sized Chromium) on every push to beta or main and on pull requests.
# If they fail, the run is marked red and the report is left in Artifacts.
name: Tests

on:
  push:
    branches: [beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Web and the APK's www/
        run: npm run www
      - name: Tests
        run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
