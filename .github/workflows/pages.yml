# Publishes the website on GitHub Pages:
# - landing/ → https://oluengo.github.io/usus/ (landing page)
# - main branch → https://oluengo.github.io/usus/app/ (the app)
# - beta branch → https://oluengo.github.io/usus/beta/ (test version, with separate data)
# Requires Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The github-pages environment only allows deploying from main: a push to beta re-runs this workflow on main,
# which assembles both branches (main at the root and beta in /beta/).
name: Web

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rerun:
    if: github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy from main (includes the beta)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          path: main
      - uses: actions/checkout@v7
        with:
          ref: refs/heads/beta
          path: beta
        continue-on-error: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Up-to-date translations (from i18n/*.po)
        run: |
          for d in main beta; do if [ -f "$d/scripts/i18n.mjs" ]; then (cd "$d" && node scripts/i18n.mjs build); fi; done

      - name: Assemble the site
        run: |
          WEB="index.html sw.js nostr.js ejercicios.json manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png favicon-48.png LICENSE PRIVACY.md README.md ANDROID.md CHANGELOG.md fonts screenshots"
          mkdir -p _site/app
          for f in $WEB; do if [ -e "main/$f" ]; then cp -r "main/$f" _site/app/; fi; done
          # Landing page at the root; its sw.js removes the old /usus/ service worker
          cp -r main/landing/. _site/
          touch _site/.nojekyll
          if [ -f beta/index.html ]; then
            mkdir -p _site/beta
            for f in $WEB; do if [ -e "beta/$f" ] && [ "$f" != "screenshots" ]; then cp -r "beta/$f" _site/beta/; fi; done
            # The beta's own cache and its own name when installed
            sed -i 's/const CACHE = "usus-/const CACHE = "usus-beta-/' _site/beta/sw.js
            node -e 'const f="_site/beta/manifest.webmanifest",fs=require("fs"),m=JSON.parse(fs.readFileSync(f,"utf8"));m.name="Usus Beta";m.short_name="Usus β";m.id="/usus/beta/";fs.writeFileSync(f,JSON.stringify(m,null,2))'
          fi
          ls -la _site _site/app _site/beta 2>/dev/null | head -60

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
