# Checks the code and translations on every push to beta or main and on pull requests:
# index.html built from src/ (npm run build), template up to date with the code, same {n} placeholders in every language and how many texts are missing.
# If it fails: run "npm run i18n" (or "npm run build") and push the changes.
name: Strings

on:
  push:
    branches: [beta, main]
    paths: ["index.html", "src/**", "i18n/**", "scripts/i18n.mjs", "scripts/build.mjs"]
  pull_request:
    paths: ["index.html", "src/**", "i18n/**", "scripts/i18n.mjs", "scripts/build.mjs"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: index.html up to date with src/
        run: node scripts/build.mjs --check
      - name: Template up to date
        run: |
          node scripts/i18n.mjs extract
          if ! git diff --quiet -- i18n/usus.pot; then
            echo "::error::i18n/usus.pot is not up to date with the code. Run: npm run i18n"; git diff --stat; exit 1
          fi
      - name: Translations
        run: node scripts/i18n.mjs check
