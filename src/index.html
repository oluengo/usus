<script>/* Beta en la web (…/usus/beta/): mismo dominio que la versión principal, así que guarda todo con el prefijo «beta:» */
(function(){var B=/\/beta\/(index\.html)?$/.test(location.pathname);window.USUS_WEB_BETA=B;if(!B)return;var S=Storage.prototype,g=S.getItem,s=S.setItem,r=S.removeItem,L=function(t){try{return t===window.localStorage}catch(e){return false}};
S.getItem=function(k){return g.call(this,L(this)?"beta:"+k:k)};S.setItem=function(k,v){return s.call(this,L(this)?"beta:"+k:k,v)};S.removeItem=function(k){return r.call(this,L(this)?"beta:"+k:k)}})();</script>
<script>try{var p=JSON.parse(localStorage.getItem("wk.profile"))||"main";document.documentElement.dataset.theme=JSON.parse(localStorage.getItem(p==="main"?"wk.theme":"wk."+p+".theme"))||"auto"}catch(e){document.documentElement.dataset.theme="auto"}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-48.png">
<link rel="apple-touch-icon" href="icon-192.png">
