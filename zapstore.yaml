# Zapstore (store on Nostr). Publishes the APK of each GitHub Release (tags vX.Y.Z, not the beta).
# Listing: taken from fastlane/metadata/android. Publish: `zsp publish` (or `zsp publish --check` to see what would be uploaded)
# with SIGN_WITH=bunker://… in the environment. Never store the nsec key here or in the repository.
repository: https://github.com/oluengo/usus
release_filter: ^v\d+\.\d+\.\d+$
match: ^usus-\d+\.\d+\.\d+\.apk$
name: Usus
summary: Calisthenics workouts and habits. No accounts, no ads; your data stays on your phone.
license: MIT
website: https://oluengo.github.io/usus/
tags: [fitness, calisthenics, workout, habits, health, privacy, offline]
