# Zapstore (store on Nostr). Publishes the APK of each GitHub Release (tags vX.Y.Z, not the beta).
# Publish: `zsp publish` (check first with `zsp check`) with SIGN_WITH=bunker://… in the environment.
# Never store the nsec key here or in the repository.
# The listing is defined here (Markdown): fastlane/ uses HTML, which Zapstore shows as text.
# Icon, screenshots and release notes are URLs, so zsp works from any folder (after pushing to main).
repository: https://github.com/oluengo/usus
release_filter: ^v\d+\.\d+\.\d+$
match: ^usus-\d+\.\d+\.\d+\.apk$
metadata_sources: []

name: Usus
summary: Calisthenics workouts and habits. No accounts, no ads; your data stays on your phone.
description: |
  Usus (Latin: *practice, habit*) logs your workouts and habits. Built for calisthenics and home training; it works for any routine of sets and reps. Free, no accounts, no ads and works offline: everything is stored only on your phone. In English, Spanish and Catalan.

  **What it does**

  - **Routines** with sets, reps or time, per side, added weight, sections, supersets and circuits. Print them or save them as PDF.
  - **Train hands-free:** one exercise per screen and a full-screen countdown with sound or vibration. It keeps going in a notification, even with the screen off.
  - **Progression:** after a session, Usus suggests moving to the next exercise or back to the previous one. You decide.
  - **Exercise catalogue** (optional): a card for each one, equipment and progression.
  - **Guided plan**, or **with AI** (optional, external): routines at your level and a plan that rotates variants in order, with deloads and pauses.
  - **Diary** for sleep, steps, weight, activity, meals and notes, and **Progress** with consistency, PRs and habits.
  - **Profiles** for several people, optional **cycle** tracking and light, dark and protector themes.
  - **Share** workouts and routines with no servers; backups and CSV.
  - **Nostr** (optional): a backup encrypted only for you and posting workouts and routines. Sign in with Amber, a bunker or your npub.

  **Privacy**

  - Everything is stored only on your device. No accounts, servers, analytics, ads or trackers.
  - Only what you export or share leaves. Without Nostr, Usus connects to nothing.
  - Permissions: vibration, and Internet only for Nostr.

  A logging tool, not medical advice. Built with AI · tested by humans.
license: MIT
website: https://oluengo.github.io/usus/
tags: [fitness, calisthenics, workout, habits, health, privacy, offline, nostr]
supported_nips: ["44", "46", "78"]

