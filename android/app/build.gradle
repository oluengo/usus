apply plugin: 'com.android.application'

// Versión: la misma que la PWA (APP_VERSION en index.html). 2.2.1 → versionCode 20201.
def ususVersion = (file('../../index.html').text =~ /const APP_VERSION = "([\d.]+)"/)[0][1]
def ususParts = ususVersion.tokenize('.').collect { it as int } + [0, 0]
def ususCode = ususParts[0] * 10000 + ususParts[1] * 100 + ususParts[2]
// Beta (USUS_BETA=1): otra app (io.github.oluengo.usus.beta), versión 2.6.0-beta.N y código 20600·1000 + N.
def ususBeta = System.getenv('USUS_BETA') == '1'
def ususBetaN = (System.getenv('USUS_BETA_N') ?: '0') as int

// Firma: desde variables de entorno (secretos de GitHub). Sin ellas, la versión release sale sin firmar.
def ksFile = System.getenv('USUS_KEYSTORE') ?: ''
def canSign = ksFile && file(ksFile).exists()

android {
    namespace = "io.github.oluengo.usus"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId ususBeta ? "io.github.oluengo.usus.beta" : "io.github.oluengo.usus"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ususBeta ? ususCode * 1000 + (ususBetaN % 1000) : ususCode
        versionName ususBeta ? "${ususVersion}-beta.${ususBetaN}" : ususVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (canSign) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('USUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('USUS_KEY_ALIAS')
                keyPassword System.getenv('USUS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (canSign) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // F-Droid / IzzyOnDroid: sin bloque de dependencias cifrado de Google.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Sin Google Services (Firebase): Usus no usa notificaciones push ni servicios de Google (requisito de F-Droid).
