<style>
@font-face { font-family: "Instrument Sans"; font-weight: 400; font-display: swap; src: url(app/fonts/instrument-sans-400.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 600; font-display: swap; src: url(app/fonts/instrument-sans-600.woff2) format("woff2"); }
@font-face { font-family: "Instrument Sans"; font-weight: 700; font-display: swap; src: url(app/fonts/instrument-sans-700.woff2) format("woff2"); }

:root {
	color-scheme: light dark;
	--bg: light-dark(#F5F6F8, #121418);
	--surface: light-dark(#FFFFFF, #1B1E24);
	--ink: light-dark(#16191F, #ECEEF2);
	--muted: light-dark(#6A7180, #9AA1AE);
	--line: light-dark(#E3E6EB, #2B2F37);
	--accent: light-dark(#2446C7, #7E98F5);
	--accent-ink: light-dark(#FFFFFF, #121418);
	--accent-soft: light-dark(#E8EDFB, #232C47);
	--ok: light-dark(#1E8A5A, #4CC08A);
	--ok-soft: light-dark(#E3F4EC, #1C3329);
	--amber: #E8A33D;
	--night: #16120E;
	--font: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); }
img { max-width: 100%; height: auto; display: block; }
.wrap { max-width: 68rem; margin: 0 auto; padding: 0 1.25rem; }
h1, h2, h3 { line-height: 1.15; letter-spacing: -.02em; margin: 0; }
h2 { font-size: clamp(1.6rem, 3.5vw, 2.2rem); margin-bottom: .6rem; }
.lead { color: var(--muted); font-size: 1.08rem; max-width: 40rem; margin: 0 0 2rem; }
section { padding: 4.5rem 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--night) 88%, transparent); backdrop-filter: blur(10px); color: #F3EEE6; }
.top .wrap { display: flex; align-items: center; gap: 1rem; height: 3.5rem; }
.top a { color: inherit; text-decoration: none; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; }
.brand img { width: 1.75rem; height: 1.75rem; border-radius: 22%; }
.top nav { margin-left: auto; display: flex; align-items: center; gap: 1.1rem; font-size: .92rem; }
.top nav .navlink { opacity: .8; }
.top nav .navlink:hover { opacity: 1; }
.lang { display: flex; gap: .15rem; font-size: .8rem; }
.lang button, .theme { font: inherit; background: none; border: 0; color: inherit; opacity: .65; cursor: pointer; padding: .25rem .35rem; border-radius: 6px; }
.lang button[aria-pressed="true"] { opacity: 1; font-weight: 700; background: rgba(255,255,255,.1); }
.theme { opacity: .8; display: grid; place-items: center; }
.theme svg { width: 1.1rem; height: 1.1rem; }
.i-sun { display: none; }
:root[data-theme="dark"] .i-sun { display: block; } :root[data-theme="dark"] .i-moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-sun { display: block; } :root:not([data-theme="light"]) .i-moon { display: none; } }

.hero { background: var(--night); color: #F3EEE6; padding: 4rem 0 0; overflow: hidden; }
.hero .wrap { display: grid; gap: 2.5rem; }
.hero .kicker { display: inline-flex; align-items: center; gap: .5rem; color: var(--amber); font-weight: 600; font-size: .9rem; letter-spacing: .02em; }
.hero h1 { font-size: clamp(2.4rem, 6vw, 4rem); margin: .7rem 0 1rem; max-width: 14ch; }
.hero p { color: #B9B1A6; font-size: 1.12rem; max-width: 34rem; margin: 0 0 1.8rem; }
.cta { display: flex; flex-wrap: wrap; gap: .75rem; }
.btn { display: inline-flex; align-items: center; gap: .5rem; padding: .8rem 1.25rem; border-radius: 12px; font-weight: 600; text-decoration: none; border: 1px solid transparent; min-height: 48px; }
.btn svg { width: 1.15rem; height: 1.15rem; }
.btn.primary { background: #2446C7; color: #fff; }
.btn.primary:hover { background: #1D3AAA; }
.btn.ghost { color: #F3EEE6; border-color: #3A332B; }
.btn.ghost:hover { border-color: #6B6156; }
.meta { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-top: 1.5rem; font-size: .88rem; color: #9C9387; list-style: none; padding: 0; }
.meta li::before { content: "✓ "; color: var(--amber); }
.hero figure { margin: 0; }
.hero figure img { width: 100%; border-radius: 18px 18px 0 0; }
@media (min-width: 60rem) {
	.hero { padding-top: 5rem; }
	.hero .wrap { grid-template-columns: 1fr 1.25fr; align-items: end; }
	.hero .copy { padding-bottom: 4.5rem; }
}

.features { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(15.5rem, 1fr)); }
.feature { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
.feature .ic { width: 2.4rem; height: 2.4rem; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: .9rem; }
.feature .ic svg { width: 1.3rem; height: 1.3rem; }
.feature h3 { font-size: 1.05rem; margin-bottom: .35rem; }
.feature p { margin: 0; color: var(--muted); font-size: .95rem; }
.opt { font-size: .72rem; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .05rem .5rem; margin-left: .35rem; vertical-align: .15em; }

.gallery { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding: .5rem 1.25rem 1.5rem; margin: 0 -1.25rem; scrollbar-width: thin; }
.gallery figure { margin: 0; flex: 0 0 auto; width: min(15rem, 62vw); scroll-snap-align: start; }
.gallery img { border-radius: 22px; border: 1px solid var(--line); aspect-ratio: 540 / 1169; object-fit: cover; background: var(--surface); }
.gallery figcaption { font-size: .88rem; color: var(--muted); margin-top: .6rem; text-align: center; }

.install { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.5rem; }
.card h3 { display: flex; align-items: center; gap: .6rem; font-size: 1.15rem; margin-bottom: 1rem; }
.card h3 svg { width: 1.4rem; height: 1.4rem; color: var(--accent); }
.card ol { margin: 0 0 1.2rem; padding-left: 1.2rem; }
.card li { margin-bottom: .45rem; }
.card .btn.primary { background: var(--accent); color: var(--accent-ink); }
.card .btn.line { border-color: var(--line); color: var(--ink); }
.card .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
.note { color: var(--muted); font-size: .9rem; margin-top: 1rem; }
code { font-size: .88em; background: var(--accent-soft); padding: .1rem .35rem; border-radius: 6px; overflow-wrap: anywhere; }

.privacy { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 2rem; display: grid; gap: 1.5rem; }
@media (min-width: 52rem) { .privacy { grid-template-columns: 1fr 1.3fr; padding: 2.5rem; } }
.privacy ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
.privacy li { display: grid; grid-template-columns: 1.6rem 1fr; gap: .5rem; }
.privacy li::before { content: "✓"; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; font-size: .8rem; font-weight: 700; margin-top: .1rem; }

.faq details { border-bottom: 1px solid var(--line); padding: 1rem 0; }
.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::after { content: "+"; color: var(--accent); font-size: 1.3rem; line-height: 1; }
.faq details[open] summary::after { content: "−"; }
.faq details p { color: var(--muted); margin: .6rem 0 0; }

footer { border-top: 1px solid var(--line); padding: 2.5rem 0 3rem; color: var(--muted); font-size: .9rem; }
footer .wrap { display: grid; gap: 1rem; }
footer .links { display: flex; flex-wrap: wrap; gap: .4rem 1.4rem; }
footer .links a { color: var(--ink); text-decoration: none; }
footer .links a:hover { color: var(--accent); }
.donate { display: grid; gap: .6rem; }
.chips { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: .45rem; font: inherit; font-size: .88rem; font-weight: 600; text-decoration: none; color: var(--ink, var(--fg)); border: 1px solid; border-radius: 999px; padding: .3rem .85rem .3rem .35rem; cursor: pointer; transition: border-color .15s, background .15s; }
.chip svg { width: 1.35rem; height: 1.35rem; flex: none; }
.chip.btc { --c: #F7931A; } .chip.ln { --c: #7B3FE4; } .chip.nostr { --c: #8E30EB; }
.chip { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 8%, transparent); }
.chip:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); text-decoration: none; }
#copied { color: var(--ok); }

@media (max-width: 40rem) {
	body { font-size: 16px; }
	section { padding: 3.25rem 0; }
	.top nav .navlink { display: none; }
}
</style>
</head>

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function pickLang() {
	const q = new URLSearchParams(location.search).get("lang");
	if (LANGS.includes(q)) return q;
	try { const s = localStorage.getItem("lang"); if (LANGS.includes(s)) return s; } catch (e) {}
	const n = (navigator.languages || [navigator.language || ""]).map(x => String(x).slice(0, 2));
	return n.find(x => LANGS.includes(x)) || "en";
}
let L;
function render(lang) {
	L = lang; const t = I[lang]; root.lang = lang;
	document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
	document.querySelectorAll("[data-i-aria]").forEach(el => { el.setAttribute("aria-label", t[el.dataset.iAria]); el.title = t[el.dataset.iAria]; });
	document.querySelectorAll("[data-i-alt]").forEach(el => { el.alt = t[el.dataset.iAlt]; });
	document.querySelectorAll("[data-list]").forEach(el => { el.innerHTML = t[el.dataset.list].map(x => "<li>" + (el.dataset.list.endsWith("Steps") ? x : esc(x)) + "</li>").join(""); });
	document.getElementById("features-list").innerHTML = t.features.map(([ic, h, p, opt]) =>
		`<div class="feature"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[ic]}</svg></div><h3>${esc(h)}${opt ? `<span class="opt">${lang === "en" ? "optional" : "opcional"}</span>` : ""}</h3><p>${esc(p)}</p></div>`).join("");
	document.getElementById("gallery").innerHTML = t.shots.map(([f, c]) =>
		`<figure><img src="app/capturas/${f}.jpg" width="540" height="1169" loading="lazy" alt="${esc(c)}"><figcaption>${esc(c)}</figcaption></figure>`).join("");
	document.getElementById("faq-list").innerHTML = t.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("");
	document.getElementById("changelog").href = "https://github.com/oluengo/usus/blob/main/CHANGELOG.md" + (lang === "en" ? "#english" : "");
	document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
	try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
	render(b.dataset.lang);
}));
try { const th = localStorage.getItem("theme"); if (th) root.dataset.theme = th; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
	const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
	root.dataset.theme = cur === "dark" ? "light" : "dark";
	try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
const copied = document.getElementById("copied"); let ct;
document.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
	let ok = false;
	try { await navigator.clipboard.writeText(b.dataset.copy); ok = true; } catch (e) {}
	copied.textContent = ok ? b.textContent + " " + I[L].copied : b.dataset.copy;
	clearTimeout(ct); ct = setTimeout(() => { copied.textContent = ""; }, ok ? 1800 : 8000);
}));
render(pickLang());
</script>
</body>
</html>
