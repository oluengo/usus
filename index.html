<link rel="manifest" href="manifest.webmanifest">

<style>
/* Tipografía incluida en la app (sin llamadas externas). Instrument Sans, SIL Open Font License 1.1: fonts/OFL.txt */
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/instrument-sans-400.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/instrument-sans-500.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/instrument-sans-600.woff2) format("woff2")}
@font-face{font-family:"Instrument Sans";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/instrument-sans-700.woff2) format("woff2")}
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#16191F; --muted:#6A7180; --line:#E3E6EB;
  --accent:#2446C7; --accent-soft:#E8EDFB; --ok:#1E8A5A; --ok-soft:#E3F4EC; --danger:#C23A3A; --cyc:#C2416E; --cyc-soft:#FBE7EE; --fert:#E4EFFA; --fert-ink:#2C6CA8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2B2F37;
    --accent:#7E98F5; --accent-soft:#232C47; --ok:#4CC08A; --ok-soft:#1C3329; --danger:#EF7A7A; --cyc:#F0789F; --cyc-soft:#3A2230; --fert:#1E2C3B; --fert-ink:#8DBDEB;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2B2F37;
  --accent:#7E98F5; --accent-soft:#232C47; --ok:#4CC08A; --ok-soft:#1C3329; --danger:#EF7A7A; --cyc:#F0789F; --cyc-soft:#3A2230; --fert:#1E2C3B; --fert-ink:#8DBDEB;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5rem;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:1.125rem;font-weight:600;margin:28px 0 10px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1320}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:.875rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=number]{text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:12px 2px 14px;font-size:.75rem;color:var(--muted);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Active session */
.clock{font-size:clamp(3rem,14vw,5rem);font-weight:600;letter-spacing:-.03em;line-height:1;margin:14px 0 4px}
.clockrow{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.clock.paused{color:var(--muted)}
.spause{padding:10px 14px}
.spaused{display:flex;flex-direction:column;gap:2px;margin:10px 0 4px;border-color:var(--accent)}
.stats-inline{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--muted);font-size:.9rem}
.stats-inline b{color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ex-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ex-head strong{font-size:1.05rem}
.ex-head .hint{color:var(--muted);font-size:.8rem}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px 32px;gap:6px 8px;align-items:center}
.sets.two{grid-template-columns:22px 1fr 1fr 1fr 44px 28px;gap:6px}
.sets .h{font-size:.75rem;color:var(--muted);text-align:center}
.sets .n{color:var(--muted);text-align:center;font-size:.9rem}
.sets input{padding:8px 6px}
.check{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.check svg{width:18px;height:18px;stroke:var(--muted);stroke-width:2.4;fill:none}
.check.on{background:var(--ok);border-color:var(--ok)}
.check.on svg{stroke:#fff}
.set-done input{background:var(--ok-soft);border-color:transparent}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:4px}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;z-index:11;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.rest button{background:none;border:0;color:inherit;opacity:.7;font-size:.85rem}
.rest.work{background:var(--accent);color:#fff}
.rest{white-space:nowrap}
:root[data-theme="dark"] .rest.work,:root[data-theme="dark"] .check.run{color:#0E1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rest.work,:root:not([data-theme="light"]) .check.run{color:#0E1320}}
.check.play svg{fill:var(--accent);stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.check.run{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:.9rem}
.flash{position:fixed;inset:0;background:var(--accent);pointer-events:none;z-index:999;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.flash{animation-duration:.01s}}
.type-t{border:1px solid var(--line);background:none;border-radius:999px;font-size:.75rem;padding:2px 9px;color:var(--muted);flex:none}

/* Routines */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .title{font-weight:600}
.card .meta{color:var(--muted);font-size:.875rem}
.rcard{padding:0}
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.fbox{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.fx{font-size:1.25rem;font-weight:700;line-height:1.25}
.fph{color:var(--muted);font-size:1rem;min-height:1.4em}
.fring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px 0}
.fring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fring circle{fill:none;stroke-width:12;stroke-linecap:round}
.fring .trk{stroke:var(--line)}
.fring.paused svg{opacity:.4}
.fnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(3.2rem,18vw,5rem);font-weight:700;letter-spacing:-.02em;line-height:1}
.fnum small{font-size:.95rem;font-weight:600;color:var(--accent);letter-spacing:0;margin-top:6px}
.fdots{display:flex;gap:6px;justify-content:center}
.fdots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.fdots i.d{background:var(--ok)}
.fdots i.c{background:var(--accent)}
.fbtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;width:100%;margin-top:18px}
.fbtns .btn{padding:14px 6px;font-size:1rem}
.nwl{margin:0;padding-left:18px;line-height:1.55}
.nwl li{margin:3px 0}
.verb{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ex-edit .chk{grid-column:3/-1;align-self:end;padding-bottom:10px}
#rVariant::placeholder,[data-pv]::placeholder{text-transform:none}
.vchip{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 6px;font-size:.75rem;font-weight:700;color:#1A1208;vertical-align:1px}
.vchip.vd{background:var(--line);color:var(--ink)}
.plan-b{margin:12px 0}
.hoybtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.hoybtns .btn{padding:12px 8px}
.sugr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.pwk{position:relative;border:0;border-radius:10px;padding:7px 6px 8px;min-height:64px;text-align:left;color:#1A1208;font:inherit;font-size:.72rem;line-height:1.3;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.pwk b{font-size:.8rem}
.pwk.dl{background:var(--line);color:var(--ink)}
.pwk.past{opacity:.5}
.pwk.now{outline:2px solid var(--ink);outline-offset:2px}
.pwk .up{position:absolute;right:6px;top:5px;font-style:normal;font-weight:700}
.pbar2{display:block;height:4px;border-radius:99px;background:rgba(0,0,0,.25);margin-top:auto;overflow:hidden}
.pbar2 i{display:block;height:100%;background:#1A1208}
.pvr{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.pvr:first-child{border-top:0}
.phr{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.phbtn{display:flex;gap:4px;align-items:center;padding-bottom:6px}
.pprev{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.pprev i{font-style:normal;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#1A1208}
.chips .ghostc{border-style:dashed;color:var(--muted)}
.rhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:14px 16px;font:inherit;cursor:pointer}
.rhead .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.rcard.open .chev{transform:rotate(180deg)}
.rcard.open{border-color:var(--accent)}
.rbody{padding:0 16px 14px}
.rex{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.rex>span:last-child{flex:none;text-align:right}
.ract{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:12px}
.ract .btn{padding-left:6px;padding-right:6px}
.ex-edit{display:grid;grid-template-columns:1fr 1fr 1fr 32px;gap:6px 8px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.ex-edit:first-of-type{border-top:0}
.ex-edit input[data-en]{grid-column:1/-1}
.fld span{display:block;font-size:.75rem;color:var(--muted);margin:0 0 3px 2px}
.fld select{padding:10px 8px}
.fld input,.fld select{height:46px}
.chk{grid-column:2/-1;display:flex;align-items:center;gap:8px;font-size:.9rem}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk .muted{font-size:.78rem}

/* History */
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sess summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
.date-badge{width:48px;text-align:center;line-height:1.1;flex:none}
.date-badge .d{font-size:1.35rem;font-weight:700}
.date-badge .m{font-size:.75rem;color:var(--muted)}
details.sess .body{padding:0 16px 14px;border-top:1px solid var(--line)}
details.sess table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
details.sess td{padding:4px 0;vertical-align:top}
details.sess td:first-child{font-weight:500;padding-right:12px;width:40%}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .v{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.8rem;margin-top:4px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.prs div{border-top:2px solid var(--accent);padding-top:8px}
.prs b{display:block;font-size:1.2rem}
.prs span{color:var(--muted);font-size:.8rem}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 2fr 36px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.bar-row .track{background:var(--accent-soft);border-radius:6px;height:10px;overflow:hidden}
.bar-row .fill{background:var(--accent);height:100%;border-radius:6px}
.bar-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-item{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.data-item:first-child{border-top:0;padding-top:0}
.data-item:last-child{padding-bottom:0}
.data-item .t{font-weight:600}
.data-item .d{color:var(--muted);font-size:.875rem}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.sync{font-size:.75rem;color:var(--muted)}
@media (max-width:420px){.kpi .v{font-size:1.3rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Tema Protector: oscuro cálido, sin azul, para primera hora */
:root[data-theme="protector"]{
  --bg:#16120E; --surface:#201A14; --ink:#E6D9C3; --muted:#A3917B; --line:#342A20;
  --accent:#D99A52; --accent-soft:#3A2A18; --ok:#93AF62; --ok-soft:#27301B; --danger:#E08A70; --cyc:#E58A9E; --cyc-soft:#3A2224; --fert:#22282A; --fert-ink:#9DBFCF;
  color-scheme:dark;
}
:root[data-theme="protector"] .btn.primary,:root[data-theme="protector"] .rest.work,:root[data-theme="protector"] .check.run{color:#1A1208}
:root[data-theme="protector"] .check.on svg{stroke:#1A1208}
:root[data-theme="dark"]{color-scheme:dark}
.wrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px;align-items:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.mbox{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:85vh;overflow:auto}
@media (min-width:600px){.modal{align-items:center}}
.lic{white-space:pre-wrap;font-size:.72rem;line-height:1.4;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0 0;max-height:240px;overflow:auto}
.tagb{font-size:.7rem;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;vertical-align:2px;white-space:nowrap}
.dnav{display:flex;align-items:center;gap:10px}
.dnav label{position:relative;display:inline-block;cursor:pointer}
.dpick{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.wrow2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:.85rem}
.wrow2 label{grid-row:1}
input[type=time]{width:100%;font:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.stars{display:flex;gap:5px}
.stars button{width:28px;height:12px;border-radius:4px;border:0;background:var(--line);padding:0}
.stars button.on{background:var(--accent)}
.supr{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.supr:first-child{border-top:0}
.supr .samt{width:74px;flex:none;text-align:center;padding:8px 6px}
.supr .snote{display:block;margin-top:5px;font-size:.82rem;padding:6px 8px;width:100%}
.supm{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.7fr) minmax(0,.7fr) 28px;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.supm:first-child{border-top:0}
.supm [data-sw]{grid-column:1/3}
.supm [data-sarch]{grid-column:3/4}
.supm.arch{opacity:.55}
textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button,.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:.85rem}
.chips button.on{border-color:var(--accent);background:var(--accent-soft)}
.kpis3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis3 b{display:block;font-size:1.15rem}
.kpis3 span{color:var(--muted);font-size:.78rem}
.noteb{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;color:var(--ink);font-size:.9rem}
.sblock.hidb{opacity:.45}
.wstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.wstrip button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px}
.wstrip button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.wstrip .wd{font-size:.68rem;color:var(--muted);text-transform:uppercase}.wstrip b{font-size:.95rem}
.wstrip .dots{display:flex;gap:2px;height:5px}.wstrip .dots i{width:4px;height:4px;border-radius:50%;background:var(--line)}.wstrip .dots i.on{background:var(--ok)}
.dtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.dtile{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:92px;min-width:0}

<div class="wrap" id="app"><p class="muted">Cargando…</p></div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString(LOC());
const fmtVol = n => n >= 10000 ? (n / 1000).toLocaleString(LOC(), {maximumFractionDigits: 1}) + " t" : Math.round(n).toLocaleString(LOC()) + " kg";
/* ---------- Idiomas ----------
   Para añadir un idioma: 1) añade su código a LANGS; 2) copia el bloque "ca" de I18N (al final del
   archivo), cámbiale el código y traduce el texto de la derecha. Lo que falte se muestra en castellano. */
const LANGS = { es: { name: "Castellano", locale: "es-ES" }, ca: { name: "Català", locale: "ca-ES" }, en: { name: "English", locale: "en-GB" } };
let LANG = "es", MESES = [], DIAS = [];
const LOC = () => LANGS[LANG]?.locale || LANG;
function T(key, p) {
  let r = (LANG !== "es" && I18N[LANG] && I18N[LANG][key]) || key;
  if (p) r = r.replace(/\{(\w+)\}/g, (_, k) => p[k] ?? "");
  return r;
}
function detectLang() {
  const saved = LS.get("wk.lang", null); if (saved && LANGS[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || ""]) { const c = String(l).toLowerCase().split("-")[0]; if (LANGS[c]) return c; }
  return "es";
}
function setLang(l) {
  LANG = LANGS[l] ? l : "es";
  document.documentElement.lang = LANG;
  document.querySelector("nav.tabs")?.setAttribute("aria-label", T("Secciones"));
  MESES = Array.from({ length: 12 }, (_, i) => new Intl.DateTimeFormat(LOC(), { month: "short" }).format(new Date(2026, i, 1)).replace(".", ""));
  DIAS = Array.from({ length: 7 }, (_, i) => new Intl.DateTimeFormat(LOC(), { weekday: "long" }).format(new Date(2026, 0, 4 + i)));  // 4 ene 2026 = domingo
}
const fmtNum = (v, d = 1) => (+v).toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0;
const isTime = e => e?.type === "time";
const fmtSec = n => { n = Math.round(+n || 0); return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")} min` : `${n} s`; };
const R2 = x => x.r2 ?? x.r;   // reps del lado derecho (si falta, igual que el izquierdo)
const sideReps = e => !!e?.sides && !isTime(e);
const fmtSet = (x, time, sides) => time ? (+x.w ? `${fmtKg(x.w)} kg · ${fmtSec(x.r)}` : fmtSec(x.r))
  : (+x.w ? `${fmtKg(x.w)}×` : "") + (sides ? `${x.r}/${R2(x)}` : `${x.r}`);

/* ---------- Almacenamiento: db del artefacto o localStorage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { toast(T("No se pudo guardar: almacenamiento lleno")); } }

  async init() { try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {} },
  async load() { return { routines: LS.get("wk.routines", []), sessions: LS.get("wk.sessions", []) }; },
  async saveRoutines(items) { LS.set("wk.routines", items); },
  async saveSession() { LS.set("wk.sessions", state.sessions); },
  async deleteSession() { LS.set("wk.sessions", state.sessions); },
  saveAll() { LS.set("wk.routines", state.routines); LS.set("wk.sessions", state.sessions); }

/* ---------- Estado ---------- */
const state = {
  tab: "train", routines: [], sessions: [],
  active: LS.get("wk.active", null),   // sesión en curso (se guarda localmente como borrador)
  editing: null,                        // rutina en edición
  statEx: null

const saveActive = () => LS.set("wk.active", state.active);

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- Utilidades de datos ---------- */
const sessionVolume = s => s.exercises.filter(e => !isTime(e)).reduce((a, e) => a + e.sets.filter(x => x.done).reduce((b, x) => b + (+x.w || 0) * (+x.r || 0), 0), 0);
/* Trabajo de una sesión: reps (ejercicios de reps), segundos (de tiempo) y kg de lastre×reps */
const sessionWork = s => s.exercises.reduce((a, e) => { e.sets.filter(x => x.done).forEach(x => { if (isTime(e)) a.secs += +x.r || 0; else { const n = (+x.r || 0) + (sideReps(e) ? (+R2(x) || 0) : 0); a.reps += n; a.kg += (+x.w || 0) * n; } }); return a; }, { reps: 0, secs: 0, kg: 0 });
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} h` : `${m} min`; };
const fmtWork = w => [`${w.reps} reps`, w.secs ? fmtSec(w.secs) + " " + T("isométricos") : "", w.kg ? fmtVol(w.kg) : ""].filter(Boolean).join(" · ");
const doneSets = s => s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
const sortedSessions = () => [...state.sessions].sort((a, b) => b.start - a.start);
function lastSetsFor(name) {
  const key = name.trim().toLowerCase();
  for (const s of sortedSessions()) {
    const e = s.exercises.find(x => x.name.trim().toLowerCase() === key);
    if (e) { const d = e.sets.filter(x => x.done); if (d.length) return d; }
  }
  return null;
}
const APP_VERSION = "1.0.0";
const THEMES = [["protector", "Protector", "Oscuro cálido, sin azul"], ["dark", "Oscuro", "Neutro"], ["light", "Claro", "Para el día"], ["auto", "Automático", "Sigue al sistema"]];
const curTheme = () => document.documentElement.dataset.theme || "protector";
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = document.getElementById("themeColor"); if (m && bg) m.setAttribute("content", bg);
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (curTheme() === "auto") applyTheme("auto"); }); } catch {}
function timeNames() {
  const set = new Set();
  [...state.routines, ...state.sessions].forEach(x => x.exercises.forEach(e => { if (e.type === "time") set.add(e.name.trim().toLowerCase()); }));
  return set;
}
function typeFor(name) { return timeNames().has(name.trim().toLowerCase()) ? "time" : "reps"; }
/* Corrige rutinas y sesión en curso creadas sin tipo (versiones antiguas) */
function migrateTypes() {
  const tn = timeNames(); let chR = false, chA = false;
  state.routines.forEach(r => r.exercises.forEach(e => { if (!e.type) { e.type = tn.has(e.name.trim().toLowerCase()) ? "time" : "reps"; chR = true; } }));
  const sideName = e => SIDE_RX.test(e.name);
  state.routines.forEach(r => r.exercises.forEach(e => { if (e.sides === undefined) { e.sides = sideName(e); chR = true; } }));
  state.active?.exercises?.forEach(e => { if (e.sides === undefined) { e.sides = sideName(e); chA = true; } });
  state.active?.exercises?.forEach(e => { if (!e.type) { e.type = tn.has(e.name.trim().toLowerCase()) ? "time" : "reps"; chA = true; } });
  state.routines.forEach(r => { if (!r.block) { r.block = guessBlock(r.name); chR = true; } });
  state.routines.forEach(r => {
    if (r.variant === undefined) { r.variant = guessVariant(r.name); chR = true; }
    if (!Array.isArray(r.days)) { const g = guessDays(r.name); r.days = g.length ? g : r.block === "diaria" ? [0, 1, 2, 3, 4, 5, 6] : []; chR = true; }
  });
  if (chR) LS.set("wk.routines", state.routines);
  // Objetivos semanales: quien ya tenía una rutina Diaria conserva los de antes (7 y 4)
  if (LS.get("wk.goals", null) === null && state.routines.length) LS.set("wk.goals", state.routines.some(r => r.block === "diaria") ? { daily: 7, strength: 4 } : { daily: 0, strength: 0 });

}
const SIDE_RX = /por lado|per costat|per side|each side/i;
/* ---------- Plan de progresión (rotación de variantes + descarga) ---------- */
const VCOL = ["#D99A52", "#93AF62", "#7FA7C9", "#C98FB8", "#D4C25E", "#8FC4B7", "#E08A70", "#B5A48C"];
const DAY_RX = [[1, /lunes|dilluns|monday|\bmon\b/i], [2, /martes|dimarts|tuesday|\btue\b/i], [3, /mi[eé]rcoles|dimecres|wednesday|\bwed\b/i],
  [4, /jueves|dijous|thursday|\bthu\b/i], [5, /viernes|divendres|friday|\bfri\b/i], [6, /s[aá]bado|dissabte|saturday|\bsat\b/i], [0, /domingo|diumenge|sunday|\bsun\b/i]];

const guessVariant = name => { const m = /^\s*([A-Z0-9]{1,3})\s*[·:\-–|]/.exec(name || ""); return m ? m[1] : ""; };

const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];           // lunes primero
const dayShort = d => T("L,M,X,J,V,S,D").split(",")[WEEK_ORDER.indexOf(d)];

function planVariants(p) { return [...new Set((p?.phases || []).map(x => normVar(x.variant)).filter(Boolean))]; }
function varColor(v, p = PL.get()) {
  const all = [...new Set([...planVariants(p), ...state.routines.map(r => normVar(r.variant)).filter(Boolean)].sort())];

const vChip = v => v ? `<span class="vchip" style="background:${varColor(v)}">${esc(v)}</span>` : "";
/* Semanas del plan: fases en orden (cada una N semanas), y tras cada X semanas de entreno, Y de descarga.
   "↑" marca la primera semana de una variante que ya había aparecido antes. */
function planWeeks(p) {
  const ph = (p?.phases || []).filter(x => normVar(x.variant) && +x.weeks > 0);

/* ---------- Diario: sueño, suplementos, notas y entrenos del día ---------- */
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

const DY = {
  all: () => LS.get("wk.diary", {}),
  get: k => DY.all()[k] || {},
  set(k, patch) { const a = DY.all(); a[k] = { ...(a[k] || {}), ...patch }; LS.set("wk.diary", a); },
  supps: () => LS.get("wk.supps", []),
  saveSupps: l => LS.set("wk.supps", l)
};
/* ---------- Ciclo menstrual (opcional, desactivado por defecto) ----------

const CYC_SYMS = ["Dolor", "Cansancio", "Hinchazón", "Dolor de cabeza", "Sensibilidad", "Ánimo bajo", "Irritabilidad", "Acné", "Antojos", "Insomnio"];
const CYC_REASONS = [["preg", "Embarazo"], ["lact", "Lactancia"], ["horm", "Anticonceptivo hormonal"], ["meno", "Perimenopausia o menopausia"], ["other", "Otro motivo"]];
const CYC = {
  cfg: () => ({ on: false, fert: true, phase: true, warn: true, warnDays: 2, pause: null, ack: false, ...(LS.get("wk.cyc", {}) || {}) }),
  set(patch) { LS.set("wk.cyc", { ...CYC.cfg(), ...patch }); },
  list: () => (LS.get("wk.cycP", []) || []).filter(x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.s)).sort((a, b) => a.s < b.s ? -1 : 1),
  save: l => LS.set("wk.cycP", l),
  syms: () => { const l = LS.get("wk.cycSyms", null); return Array.isArray(l) ? l : CYC_SYMS.slice(); },
  saveSyms: l => LS.set("wk.cycSyms", l)
};
const cycOn = () => CYC.cfg().on;
const kAdd = (k, n) => dayKey(addDays(keyTime(k), n));
const kDiff = (a, b) => Math.round((keyTime(a) - keyTime(b)) / 864e5);
const kFmt = (k, o = { day: "numeric", month: "short" }) => new Date(keyTime(k)).toLocaleDateString(LOC(), o);
/* Cálculo: media de los últimos 6 ciclos (28 días hasta tener 2), ovulación 14 días antes de la regla siguiente, ventana fértil de −5 a +1 */
function cycCalc(today = dayKey(Date.now())) {
  const P = CYC.list().filter(x => x.s <= today), c = CYC.cfg();
  const lens = P.slice(1).map((x, i) => kDiff(x.s, P[i].s)).filter(n => n >= 15 && n <= 60).slice(-6);
  const avg = lens.length >= 2 ? lens.reduce((a, b) => a + b, 0) / lens.length : 28;
  const sd = lens.length >= 2 ? Math.sqrt(lens.reduce((a, b) => a + (b - avg) ** 2, 0) / lens.length) : null;
  const done = P.filter(x => x.e && x.e >= x.s).slice(-6).map(x => kDiff(x.e, x.s) + 1);
  const per = done.length ? Math.round(done.reduce((a, b) => a + b, 0) / done.length) : 5;
  const L = Math.round(avg), last = P[P.length - 1] || null;
  const spread = sd === null ? 3 : Math.max(1, Math.round(sd));
  const irregular = lens.length >= 3 && Math.max(...lens) - Math.min(...lens) > 7;
  const r = { P, lens, avg, sd, per, L, last, spread, irregular, today, paused: !!c.pause };
  if (!last) return r;
  const lastEnd = last.e || (kDiff(today, last.s) < 10 ? null : kAdd(last.s, per - 1));
  r.ongoing = !last.e && kDiff(today, last.s) < 10;
  r.lastEnd = lastEnd;
  r.day = kDiff(today, last.s) + 1;
  r.next = kAdd(last.s, L);
  r.late = today > r.next ? kDiff(today, r.next) : 0;
  r.proj = [1, 2, 3].map(n => { const st = kAdd(last.s, L * n), ov = kAdd(st, -14); return { start: st, end: kAdd(st, per - 1), ov, fa: kAdd(ov, -5), fb: kAdd(ov, 1) }; });
  r.cur = { ov: kAdd(last.s, L - 14) };
  r.cur.fa = kAdd(r.cur.ov, -5); r.cur.fb = kAdd(r.cur.ov, 1);
  return r;
}
/* Fase de un día del ciclo actual */
function cycPhase(r, k = r.today) {
  if (!r.last) return null;
  const c = CYC.cfg(), d = kDiff(k, r.last.s) + 1;
  if (r.ongoing || (r.lastEnd && k <= r.lastEnd)) return T("Menstruación");
  if (c.pause) return null;
  if (k < r.cur.fa) return T("Folicular");
  if (k <= r.cur.fb) return c.fert ? (k === r.cur.ov ? T("Ovulación (aprox.)") : T("Ventana fértil")) : (k < r.cur.ov ? T("Folicular") : T("Lútea"));
  return d > r.L + 10 ? null : T("Lútea");
}
/* Qué es cada día en el calendario: regla registrada, prevista, ovulación o ventana fértil */
function cycKind(k, r) {
  const c = CYC.cfg();
  for (const x of r.P) { const e = x.e || (x === r.last ? (r.ongoing ? r.today : r.lastEnd) : kAdd(x.s, r.per - 1)); if (k >= x.s && k <= e) return "per"; }
  if (!r.last || c.pause) return "";
  const cand = [r.cur, ...r.proj];
  for (const pj of r.proj) if (k > r.today && k >= pj.start && k <= pj.end) return "pred";
  if (c.fert) for (const x of cand) { if (k === x.ov) return "ov"; if (k >= x.fa && k <= x.fb) return "fert"; }
  return "";
}

  const sp = DY.supps(), all = DY.all();

  const rows = sp.filter(x => !x.archived).map(x => {
    const firstRec = Object.keys(all).filter(k => all[k]?.supp?.[x.id]).sort()[0];
    const from = Math.max(dayStart(now - (statsPer() - 1) * 864e5), Math.min(dayStart(x.created || now), firstRec ? keyTime(firstRec) : Infinity));
    let days = 0, tk = 0; for (let t = from; t <= now; t = addDays(t, 1)) { days++; if (all[dayKey(t)]?.supp?.[x.id]?.taken) tk++; }
    const pct = days ? Math.round(tk / days * 100) : 0, col = pct >= 90 ? "var(--ok)" : pct >= 60 ? "var(--accent)" : "var(--danger)";
    return `<div class="bar2"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span><div class="pbar" style="margin:0"><i style="width:${pct}%;background:${col}"></i></div><span style="text-align:right">${pct}%</span></div>`;
  });

  return `<div class="panel">${rows.join("")}<p class="muted" style="font-size:.78rem;margin:8px 0 0">${T("Días tomados en el periodo (o desde que lo añadiste).")}</p>${suplLog(now)}</div>`;
}
/* Registro de tomas: una fila por suplemento, una columna por día (los últimos 14). Toca una casilla para abrir ese día en el Diario */
function suplLog(now) {
  const sp = DY.supps().filter(x => !x.archived), all = DY.all(), N = 14;
  if (!sp.length) return "";
  const days = Array.from({ length: N }, (_, i) => dayStart(now - (N - 1 - i) * 864e5));
  const wd = t => new Date(t).toLocaleDateString(LOC(), { weekday: "narrow" });
  const head = `${days.map((t, i) => `<span class="sh${i === N - 1 ? " today" : ""}">${wd(t)}<br>${new Date(t).getDate()}</span>`).join("")}`;
  const rows = sp.map(x => {
    const firstRec = Object.keys(all).filter(k => all[k]?.supp?.[x.id]).sort()[0];
    const since = Math.min(dayStart(x.created || now), firstRec ? keyTime(firstRec) : Infinity);
    let tk = 0, ex = 0;
    const cells = days.map(t => { const k = dayKey(t), v = all[k]?.supp?.[x.id], lbl = new Date(t).toLocaleDateString(LOC(), { weekday: "long", day: "numeric", month: "long" });
      if (t < since && !v?.taken) return `<span class="sd na" aria-hidden="true"></span>`;
      ex++; if (v?.taken) tk++;
      return `<button class="sd${v?.taken ? " on" : ""}" data-day="${k}" title="${esc(lbl)}${v?.taken && v.amount ? " · " + esc(v.amount) : ""}" aria-label="${esc(x.name)} · ${esc(lbl)} · ${v?.taken ? T("Tomado") : T("No tomado")}"></button>`; }).join("");
    return `<span class="sn">${esc(x.name)}</span><span class="sc">${tk}/${ex}</span>${cells}`;
  }).join("");
  return `<h3 style="font-size:.95rem;margin:18px 0 0">${T("Registro de tomas · 14 días")}</h3>
    <div class="sgrid" role="group" aria-label="${T("Registro de tomas · 14 días")}">${head}${rows}</div>
    <p class="muted" style="font-size:.78rem;margin:10px 0 0">● ${T("Tomado")} · ○ ${T("No tomado")} · ${T("Toca un día para abrirlo en el Diario.")}</p>`;
}
function sbNotas(now) {

function exerciseProgress(name) {
  const key = name.trim().toLowerCase();
  const found = [...state.sessions].sort((a, b) => a.start - b.start)
    .map(s => ({ t: s.start, e: s.exercises.find(x => x.name.trim().toLowerCase() === key) })).filter(p => p.e);
  // Modo: tiempo (segundos), peso corporal (reps) o con carga (1RM estimado)
  let mode = found.some(p => isTime(p.e)) ? "time" : found.some(p => p.e.sets.some(x => +x.w > 0)) ? "load" : "reps";
  if (mode === "reps" && found.some(p => p.e.sides)) mode = "sides";
  const pts = found.map(({ t, e }) => {
    const best = mode === "load" ? Math.max(...e.sets.map(x => e1rm(x.w, x.r))) : Math.max(...e.sets.map(x => +x.r || 0));
    const best2 = Math.max(...e.sets.map(x => +R2(x) || 0));
    const total = mode === "load" ? e.sets.reduce((a, x) => a + x.w * x.r, 0) : e.sets.reduce((a, x) => a + (+x.r || 0), 0);
    const maxW = Math.max(...e.sets.map(x => +x.w || 0));
    return { t, best, best2, total, maxW };
  });
  const prB = Math.max(...pts.map(p => p.best)), prT = Math.max(...pts.map(p => p.total)), prW = Math.max(...pts.map(p => p.maxW));
  const M = {
    load: { unit: v => `${fmtKg(v)} kg`, label: T("1RM estimado (fórmula de Epley) por sesión"), cells: [[`${fmtKg(prW)} kg`, T("Peso máximo")], [`${fmtKg(prB)} kg`, T("1RM estimado")], [fmtVol(prT), T("Mejor volumen")]] },
    sides: { unit: v => `${Math.round(v)} reps`, label: T("Mejor serie por lado (reps) por sesión"), cells: [[`${prB}`, T("Mejor izq.")], [`${Math.max(...pts.map(p => p.best2))}`, T("Mejor der.")], [`${pts.length}`, T("Sesiones")]] },
    reps: { unit: v => `${Math.round(v)} reps`, label: T("Mejor serie (repeticiones) por sesión"), cells: [[`${prB}`, T("Mejor serie (reps)")], [`${prT}`, T("Más reps en una sesión")], [`${pts.length}`, T("Sesiones")]] },
    time: { unit: v => fmtSec(v), label: T("Mejor serie (segundos) por sesión"), cells: [[fmtSec(prB), T("Mejor serie")], [fmtSec(prT), T("Más tiempo en una sesión")], [prW ? `${fmtKg(prW)} kg` : `${pts.length}`, prW ? T("Lastre máximo") : T("Sesiones")]] }
  }[mode];
  const prs = `<div class="prs">${M.cells.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
  if (pts.length < 2) return `<p class="muted" style="margin:14px 0 0">${T("Registra este ejercicio en al menos dos sesiones para ver la evolución.")}</p>${prs}`;

  const W = 640, H = 220, pl = 40, pr = 12, pt = 16, pb = 28;
  const ys = mode === "sides" ? pts.flatMap(p => [p.best, p.best2]) : pts.map(p => p.best);
  let lo = Math.min(...ys) * 0.95, hi = Math.max(...ys) * 1.03 || 1;
  if (hi - lo < 4) { const mid = (Math.min(...ys) + Math.max(...ys)) / 2; lo = Math.max(0, mid - 2); hi = lo + 4; } // evita ejes con valores repetidos
  const X = i => pl + (i / (pts.length - 1)) * (W - pl - pr);
  const Y = v => pt + (1 - (v - lo) / (hi - lo || 1)) * (H - pt - pb);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(M.label)}: ${esc(name)}">`;
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${Math.round(v)}</text>`;
  }
  svg += `<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--accent)" points="${pts.map((p, i) => `${X(i)},${Y(p.best)}`).join(" ")}"/>`;
  if (mode === "sides") {
    svg += `<polyline fill="none" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" style="stroke:var(--ink)" points="${pts.map((p, i) => `${X(i)},${Y(p.best2)}`).join(" ")}"/>`;
    pts.forEach((p, i) => { svg += `<circle cx="${X(i)}" cy="${Y(p.best2)}" r="4" style="fill:var(--surface);stroke:var(--ink)" stroke-width="2"><title>${new Date(p.t).toLocaleDateString(LOC())} · ${T("der.")} ${p.best2} reps</title></circle>`; });
  }
  pts.forEach((p, i) => {
    const d = new Date(p.t);
    svg += `<circle cx="${X(i)}" cy="${Y(p.best)}" r="4" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"><title>${d.toLocaleDateString(LOC())} · ${M.unit(p.best)}</title></circle>`;
  });
  const idx = pts.length <= 6 ? pts.map((_, i) => i) : [0, Math.floor(pts.length / 3), Math.floor(2 * pts.length / 3), pts.length - 1];
  idx.forEach(i => { const d = new Date(pts[i].t); svg += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${d.getDate()} ${MESES[d.getMonth()]}</text>`; });
  svg += "</svg>";
  const legend = mode === "sides" ? `<p class="muted" style="margin:6px 0 0;font-size:.8rem"><span style="color:var(--accent)">━</span> ${T("Izquierdo")} · <span style="color:var(--ink)">╍</span> ${T("Derecho")}</p>` : "";
  return `<p class="muted" style="margin:14px 0 6px;font-size:.85rem">${M.label}</p><div class="chart">${svg}</div>${legend}${prs}`;
}

(async () => {
  setLang(detectLang());
  renderTabs();
  await store.init();
  const data = await store.load();
  state.routines = data.routines; state.sessions = data.sessions;
  migrateTypes();
  applyTheme(curTheme());
  if (LS.get("wk.welcomed", false) && LS.get("wk.seenVersion", null) !== APP_VERSION && CHANGES[0][0] === APP_VERSION) state.newsOpen = "new";
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
