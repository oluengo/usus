:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#16191F; --muted:#6A7180; --line:#E3E6EB;
  --accent:#2446C7; --accent-soft:#E8EDFB; --ok:#1E8A5A; --ok-soft:#E3F4EC; --danger:#C23A3A; --cyc:#C2416E; --cyc-soft:#FBE7EE; --fert:#E4EFFA; --fert-ink:#2C6CA8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2B2F37;
    --accent:#7E98F5; --accent-soft:#232C47; --ok:#4CC08A; --ok-soft:#1C3329; --danger:#EF7A7A; --cyc:#F0789F; --cyc-soft:#3A2230; --fert:#1E2C3B; --fert-ink:#8DBDEB;
  }
}
:root[data-theme="dark"]{
  --bg:#121418; --surface:#1B1E24; --ink:#ECEEF2; --muted:#9AA1AE; --line:#2B2F37;
  --accent:#7E98F5; --accent-soft:#232C47; --ok:#4CC08A; --ok-soft:#1C3329; --danger:#EF7A7A; --cyc:#F0789F; --cyc-soft:#3A2230; --fert:#1E2C3B; --fert-ink:#8DBDEB;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5rem;font-weight:700;margin:4px 0 2px;letter-spacing:-.01em}
h2{font-size:1.125rem;font-weight:600;margin:28px 0 10px}
.sub{color:var(--muted);font-size:.9rem;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;min-height:44px;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1320}}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:10px;padding-right:10px}
.btn.danger{color:var(--danger);background:transparent;border-color:transparent}
.btn.small{padding:6px 12px;font-size:.875rem;min-height:36px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=search],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input[type=number]{text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:36px 16px;border:1px dashed var(--line);border-radius:14px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:12px 2px 14px;font-size:.75rem;color:var(--muted);font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* Active session */
.clock{font-size:clamp(3rem,14vw,5rem);font-weight:600;letter-spacing:-.03em;line-height:1;margin:14px 0 4px}
.clockrow{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.clock.paused{color:var(--muted)}
.spause{padding:10px 14px}
.spaused{display:flex;flex-direction:column;gap:2px;margin:10px 0 4px;border-color:var(--accent)}
.stats-inline{display:flex;flex-wrap:wrap;gap:4px 20px;color:var(--muted);font-size:.9rem}
.stats-inline b{color:var(--ink);font-weight:600}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ex-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.ex-head strong{font-size:1.05rem}
.ex-head .hint{color:var(--muted);font-size:.8rem}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px 32px;gap:6px 8px;align-items:center}
.sets.two{grid-template-columns:22px 1fr 1fr 1fr 44px 28px;gap:6px}
.sets .h{font-size:.75rem;color:var(--muted);text-align:center}
.sets .n{color:var(--muted);text-align:center;font-size:.9rem}
.sets input{padding:8px 6px}
.check{width:48px;height:44px;border-radius:12px;border:2px solid color-mix(in srgb,var(--muted) 55%,var(--line));background:var(--surface);display:grid;place-items:center;transition:background .12s,border-color .12s,transform .12s}
.check svg{width:22px;height:22px;stroke:color-mix(in srgb,var(--muted) 45%,var(--line));stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check.on{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.check.on svg{stroke:#fff;stroke-width:3.4}
.check:active{transform:scale(.94)}
.set-done input{background:var(--ok-soft);border-color:transparent}
.x{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:4px}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 16px;display:flex;gap:12px;align-items:center;font-weight:600;z-index:11;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.rest button{background:none;border:0;color:inherit;opacity:.7;font-size:.85rem}
.rest.work{background:var(--accent);color:#fff}
.rest{white-space:nowrap}
:root[data-theme="dark"] .rest.work,:root[data-theme="dark"] .check.run{color:#0E1320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rest.work,:root:not([data-theme="light"]) .check.run{color:#0E1320}}
.check.play svg{fill:var(--accent);stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.check.run{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;font-size:.9rem}
.flash{position:fixed;inset:0;background:var(--accent);pointer-events:none;z-index:999;animation:fl .7s ease-out forwards}
@keyframes fl{0%{opacity:.6}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.flash{animation-duration:.01s}}
.type-t{border:1px solid var(--line);background:none;border-radius:999px;font-size:.75rem;padding:2px 9px;color:var(--muted);flex:none}

/* Routines */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card .title{font-weight:600}
.card .meta{color:var(--muted);font-size:.875rem}
.rcard{padding:0}
.focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.fbox{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.fx{font-size:1.25rem;font-weight:700;line-height:1.25}
.fph{color:var(--muted);font-size:1rem;min-height:1.4em}
.fring{position:relative;width:min(72vw,280px);aspect-ratio:1;margin:8px 0}
.fring svg{width:100%;height:100%;transform:rotate(-90deg)}
.fring circle{fill:none;stroke-width:12;stroke-linecap:round}
.fring .trk{stroke:var(--line)}
.fring.paused svg{opacity:.4}
.fnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(3.2rem,18vw,5rem);font-weight:700;letter-spacing:-.02em;line-height:1}
.fnum small{font-size:.95rem;font-weight:600;color:var(--accent);letter-spacing:0;margin-top:6px}
.fdots{display:flex;gap:6px;justify-content:center}
.fdots i{width:28px;height:6px;border-radius:3px;background:var(--line)}
.fdots i.d{background:var(--ok)}
.fdots i.c{background:var(--accent)}
.fbtns{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;width:100%;margin-top:18px}
.fbtns .btn{padding:14px 6px;font-size:1rem}
.nwl{margin:0;padding-left:18px;line-height:1.55}
.nwl li{margin:3px 0}
.verb{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ex-edit .chk{grid-column:3/-1;align-self:end;padding-bottom:10px}
#rVariant::placeholder,[data-pv]::placeholder{text-transform:none}
.vchip{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 6px;font-size:.75rem;font-weight:700;color:#1A1208;vertical-align:1px}
.plr{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.plr:first-of-type{border-top:0}
.vchip.vd{background:var(--line);color:var(--ink)}
.plan-b{margin:12px 0}
.hoybtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:20px}
.hoybtns .btn{padding:12px 8px}
.sugr{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);margin-top:6px}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.pwk{position:relative;border:0;border-radius:10px;padding:7px 6px 8px;min-height:64px;text-align:left;color:#1A1208;font:inherit;font-size:.72rem;line-height:1.3;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.pwk b{font-size:.8rem}
.pwk.dl{background:var(--line);color:var(--ink)}
.pwk.pz{background:repeating-linear-gradient(135deg,var(--line) 0 6px,var(--surface) 6px 12px);color:var(--ink)}
.pwk.past{background-image:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5))}
.pwk.now{outline:2px solid var(--ink);outline-offset:2px}
.pwk .up{position:absolute;right:6px;top:5px;font-style:normal;font-weight:700}
.pbar2{display:block;height:4px;border-radius:99px;background:rgba(0,0,0,.25);margin-top:auto;overflow:hidden}
.pbar2 i{display:block;height:100%;background:#1A1208}
.pvr{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.pvr:first-child{border-top:0}
.phr{display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.phbtn{display:flex;gap:4px;align-items:center;padding-bottom:6px}
.pprev{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}
.pprev i{font-style:normal;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#1A1208}
.chips .ghostc{border-style:dashed;color:var(--muted)}
.rhead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:14px 16px;font:inherit;cursor:pointer}
.rhead .chev{width:20px;height:20px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.rcard.open .chev{transform:rotate(180deg)}
.rcard.open{border-color:var(--accent)}
.rbody{padding:0 16px 14px}
.rex{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.rex>span:last-child{flex:none;text-align:right}
.ract{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:8px;margin-top:12px}
.ract .btn{padding-left:6px;padding-right:6px}
.ex-edit{display:grid;grid-template-columns:1fr 1fr 1fr 32px;gap:6px 8px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.ex-edit:first-of-type{border-top:0}
.ex-edit input[data-en]{grid-column:1/-1}
.fld span{display:block;font-size:.75rem;color:var(--muted);margin:0 0 3px 2px}
.fld select{padding:10px 8px}
.fld input,.fld select{height:46px}
.chk{grid-column:2/-1;display:flex;align-items:center;gap:8px;font-size:.9rem}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk .muted{font-size:.78rem}

/* History */
details.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sess summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer}
details.sess summary::-webkit-details-marker{display:none}
.date-badge{width:48px;text-align:center;line-height:1.1;flex:none}
.date-badge .d{font-size:1.35rem;font-weight:700}
.date-badge .m{font-size:.75rem;color:var(--muted)}
details.sess .body{padding:0 16px 14px;border-top:1px solid var(--line)}
details.sess table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:8px}
details.sess td{padding:4px 0;vertical-align:top}
details.sess td:first-child{font-weight:500;padding-right:12px;width:40%}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .v{font-size:1.6rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{color:var(--muted);font-size:.8rem;margin-top:4px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.prs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.prs div{border-top:2px solid var(--accent);padding-top:8px}
.prs b{display:block;font-size:1.2rem}
.prs span{color:var(--muted);font-size:.8rem}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 2fr 36px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
.bar-row .track{background:var(--accent-soft);border-radius:6px;height:10px;overflow:hidden}
.bar-row .fill{background:var(--accent);height:100%;border-radius:6px}
.bar-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.data-item{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.data-item:first-child{border-top:0;padding-top:0}
.data-item:last-child{padding-bottom:0}
.data-item .t{font-weight:600}
.data-item .d{color:var(--muted);font-size:.875rem}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.9rem;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.sync{font-size:.75rem;color:var(--muted)}
@media (max-width:420px){.kpi .v{font-size:1.3rem}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* Tema Protector: oscuro cálido, sin azul, para primera hora */
:root[data-theme="protector"]{
  --bg:#16120E; --surface:#201A14; --ink:#E6D9C3; --muted:#A3917B; --line:#342A20;
  --accent:#D99A52; --accent-soft:#3A2A18; --ok:#93AF62; --ok-soft:#27301B; --danger:#E08A70; --cyc:#E58A9E; --cyc-soft:#3A2224; --fert:#22282A; --fert-ink:#9DBFCF;
  color-scheme:dark;
}
:root[data-theme="protector"] .btn.primary,:root[data-theme="protector"] .rest.work,:root[data-theme="protector"] .check.run{color:#1A1208}
:root[data-theme="protector"] .check.on svg{stroke:#1A1208}
:root[data-theme="dark"]{color-scheme:dark}
/* Catálogo de ejercicios: nivel (barras), material (iconos), fichas, selector y vincular */
:root{--off:#D5DAE2;--l1:#3E9C6B;--l2:#7BA23A;--l3:#C9A227;--l4:#D9792B;--l5:#C8423A;--warn:#B26B00;--warn-soft:#FFF3DC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--off:#353A44;--l1:#5DBB8A;--l2:#9BC25A;--l3:#E0BE4A;--l4:#EE9450;--l5:#EE6A60;--warn:#E0A84E;--warn-soft:#3A2D16}}
:root[data-theme="dark"]{--off:#353A44;--l1:#5DBB8A;--l2:#9BC25A;--l3:#E0BE4A;--l4:#EE9450;--l5:#EE6A60;--warn:#E0A84E;--warn-soft:#3A2D16}
:root[data-theme="protector"]{--off:#3D3227;--l1:#93AF62;--l2:#B5B45A;--l3:#D9B252;--l4:#E08A50;--l5:#E06A5A;--warn:#E0A84E;--warn-soft:#3A2D16}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:11px;flex:none}
.bars i{width:3px;border-radius:1px;background:var(--off)}
.bars i:nth-child(1){height:3px}.bars i:nth-child(2){height:5px}.bars i:nth-child(3){height:7px}.bars i:nth-child(4){height:9px}.bars i:nth-child(5){height:11px}
.bars.l1 i.on{background:var(--l1)}.bars.l2 i.on{background:var(--l2)}.bars.l3 i.on{background:var(--l3)}.bars.l4 i.on{background:var(--l4)}.bars.l5 i.on{background:var(--l5)}
.mat{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.mat svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mat.no{background:var(--warn-soft);color:var(--warn)}
.mats{display:inline-flex;gap:3px;flex:none;align-items:center;flex-wrap:wrap}
.otag{font-size:.72rem;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted);white-space:nowrap}
.rseg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin-top:14px}
.rseg button{border:0;background:none;padding:9px;font-size:.9rem;color:var(--muted)}
.rseg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.xsearch{width:100%;margin-top:12px}
.chips.xchips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

.hm [data-day]{cursor:pointer}

.sblock{margin-top:22px}

.dropz{min-height:40px;border-radius:12px;transition:background .15s}.dropz.over{background:var(--accent-soft)}.dz{padding:10px 4px;margin:0;font-size:.85rem}
.selbar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.12)}

.edcat{display:none}
.rsec{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}

.gbar{margin-top:10px;padding:10px 12px;border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:14px;font-size:.92rem}
.gbar b{color:var(--accent)}.gbar small{color:var(--muted);font-size:.78rem}
.gseq{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:6px 0 4px}.gseq span{color:var(--muted)}
.gseq button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:.82rem;cursor:pointer}

/* 3.0 · Componentes: interruptor, filas de ajustes, hojas inferiores */
input[type=checkbox][role=switch]{-webkit-appearance:none;appearance:none;width:46px;height:28px;border-radius:999px;background:color-mix(in srgb,var(--muted) 55%,var(--line));position:relative;flex:none;cursor:pointer;margin:0;transition:background .15s;accent-color:auto}
input[type=checkbox][role=switch]::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
input[type=checkbox][role=switch]:checked{background:var(--accent)}
input[type=checkbox][role=switch]:checked::before{transform:translateX(18px)}
input[type=checkbox][role=switch]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;border-top:1px solid var(--line);cursor:default}
label.srow{cursor:pointer}
.srow:first-child{border-top:0}
.srow .t{flex:1;min-width:0;font-size:.95rem}
.srow .t small{display:block;color:var(--muted);font-size:.8rem;margin-top:1px}
.srow input[type=number]{width:84px;flex:none;text-align:center;padding:8px}
.srow select{width:auto;max-width:55%;flex:none}
.note{color:var(--muted);font-size:.8rem;margin:8px 4px 0}
.swrow{color:var(--ink);font-size:.95rem;padding:12px 0 0;align-items:center}
.swrow small{display:block;color:var(--muted);font-size:.8rem}
.addh{font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
/* Pantalla completa en el móvil para lo largo (ficha, compartir, analizar con IA, recibir rutinas): Atrás arriba */
.mbox.full>.back{display:none}
@media (max-width:999px){
  .modal:has(.mbox.full){padding:0;background:var(--bg)}
  .mbox.full{height:100%;max-height:none;border-radius:0;border:0;padding-top:calc(4px + env(safe-area-inset-top,0px))}
  .mbox.full::before{display:none}
  .mbox.full>.back{display:inline-flex}
  .mbox.full .sb-head>.btn[data-act$="-close"]{display:none}
}
/* Antes de iniciar la sesión: Iniciar arriba y fijo */
.prebar{position:sticky;top:0;z-index:6;display:grid;gap:4px;margin:4px -16px 12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.prebar .btn{width:100%;padding:14px;font-size:1.05rem}
.prebar small{text-align:center;font-size:.8rem}
.dupw{display:block;color:var(--warn);font-weight:600;font-size:.8rem}
/* Plan: rutinas y días */
.pvar{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--bg)}
.pvh{font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:6px}
.prr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prr .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prr .pdays,.prr .dupw{grid-column:1/-1}
.pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.pdays button{min-height:36px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:600;color:var(--muted);padding:0}
.pdays button.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .pdays button.on,:root[data-theme="protector"] .pdays button.on{color:#1A1208}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pdays button.on{color:#1A1208}}
.pvar select{margin-top:8px}
/* Hoy: la semana del plan en una línea */
.weekline{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;text-align:left;min-height:44px}
.weekline>span:first-child{flex:1}
.wdots{display:flex;gap:4px}.wdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted)}.wdots i.on{background:var(--ok);border-color:var(--ok)}
/* Zona peligrosa */
.dzone{border:1.5px solid var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--surface));border-radius:16px;padding:14px 16px}
.dzone b{color:var(--danger)}.dzone p{margin:6px 0 12px;font-size:.88rem}
.btn.dangerfill{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn.dangerfill,:root[data-theme="protector"] .btn.dangerfill{color:#1A1208}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString(LOC());
const fmtVol = n => n >= 10000 ? (n / 1000).toLocaleString(LOC(), {maximumFractionDigits: 1}) + " t" : Math.round(n).toLocaleString(LOC()) + " kg";
/* ---------- Idiomas ----------
   Para añadir un idioma: 1) añade su código a LANGS; 2) crea i18n/<código>.po (copiando ca.po) y tradúcelo;
   3) node scripts/i18n.mjs build. Lo que falte se muestra en castellano. */
const LANGS = { es: { name: "Castellano", locale: "es-ES" }, ca: { name: "Català", locale: "ca-ES" }, en: { name: "English", locale: "en-GB" } };

const LOC = () => LANGS[LANG]?.locale || LANG;
/* Textos: el castellano es el original (msgid); las traducciones vienen de i18n/*.po y se generan en I18N.

  return fill(tr ? tr[Math.min(form, tr.length - 1)] : form ? other : one, { n, ...p });

const N_ = s => s;
function detectLang() {
  const saved = LS.get("wk.lang", null); if (saved && LANGS[saved]) return saved;
  for (const l of navigator.languages || [navigator.language || ""]) { const c = String(l).toLowerCase().split("-")[0]; if (LANGS[c]) return c; }
  return "es";
}
function setLang(l) {
  LANG = LANGS[l] ? l : "es";
  document.documentElement.lang = LANG;
  document.querySelector("nav.tabs")?.setAttribute("aria-label", T("Secciones"));
  MESES = Array.from({ length: 12 }, (_, i) => new Intl.DateTimeFormat(LOC(), { month: "short" }).format(new Date(2026, i, 1)).replace(".", ""));
  DIAS = Array.from({ length: 7 }, (_, i) => new Intl.DateTimeFormat(LOC(), { weekday: "long" }).format(new Date(2026, 0, 4 + i)));  // 4 ene 2026 = domingo
}
const fmtNum = (v, d = 1) => (+v).toLocaleString(LOC(), { minimumFractionDigits: d, maximumFractionDigits: d });
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0;
const isTime = e => e?.type === "time";
const fmtSec = n => { n = Math.round(+n || 0); return n >= 60 ? `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")} min` : `${n} s`; };
const R2 = x => x.r2 ?? x.r;   // reps del lado derecho (si falta, igual que el izquierdo)
const sideReps = e => !!e?.sides && !isTime(e);
const fmtSet = (x, time, sides) => time ? (+x.w ? `${fmtKg(x.w)} kg · ${fmtSec(x.r)}` : fmtSec(x.r))
  : (+x.w ? `${fmtKg(x.w)}×` : "") + (sides ? `${x.r}/${R2(x)}` : `${x.r}`);

/* ---------- Almacenamiento: db del artefacto o localStorage ---------- */
/* Versión de pruebas: la web en …/beta/ (datos aparte, ver <head>) o el APK «Usus Beta» (otra app, datos aparte) */
const BETA = !!(window.USUS_WEB_BETA || window.USUS_BETA);
const REL_URL = BETA ? "https://github.com/oluengo/usus/releases/tag/usus-beta" : "https://github.com/oluengo/usus/releases/latest";
/* Claves de localStorage de esta versión (en la beta web, sin el prefijo; en la principal, sin las de la beta) */
const lsKeys = () => { try { const k = Object.keys(localStorage); return window.USUS_WEB_BETA ? k.filter(x => x.startsWith("beta:")).map(x => x.slice(5)) : k.filter(x => !x.startsWith("beta:")); } catch { return []; } };
if (BETA) { document.documentElement.classList.add("beta"); document.title = "Usus Beta"; const bt = document.getElementById("betaTag"); if (bt) bt.hidden = false; }
/* Perfiles: el primero ("main") usa las claves de siempre (wk.*); los demás, wk.<id>.*. No renombrar nunca las claves. */
const GLOBAL_KEYS = new Set(["wk.profiles", "wk.profile", "wk.welcomed", "wk.seenVersion", "wk.apkTip"]);
const rawGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const PROFS = () => { const l = rawGet("wk.profiles", null); return Array.isArray(l) && l.length ? l : [{ id: "main" }]; };
const PROF = (() => { const id = rawGet("wk.profile", "main"), l = PROFS(); return l.some(p => p.id === id) ? id : l[0].id; })();
const PK = (k, id = PROF) => id === "main" || GLOBAL_KEYS.has(k) ? k : k.replace(/^wk\./, `wk.${id}.`);
const LS = {
  get(k, d) { return rawGet(PK(k), d); },
  set(k, v) { try { localStorage.setItem(PK(k), JSON.stringify(v)); } catch { toast(T("No se pudo guardar: almacenamiento lleno")); } }
};
const store = {
  async init() { try { if (navigator.storage?.persist) await navigator.storage.persist(); } catch {} },
  async load() { return { routines: LS.get("wk.routines", []), sessions: LS.get("wk.sessions", []) }; },
  async saveRoutines(items) { LS.set("wk.routines", items); },
  async saveSession() { LS.set("wk.sessions", state.sessions); },
  async deleteSession() { LS.set("wk.sessions", state.sessions); },
  saveAll() { LS.set("wk.routines", state.routines); LS.set("wk.sessions", state.sessions); }
};

/* ---------- Estado ---------- */
const state = {
  tab: "train", routines: [], sessions: [], setTab: null,
  active: LS.get("wk.active", null),   // sesión en curso (se guarda localmente como borrador)
  editing: null,                        // rutina en edición
  statEx: null
};
const saveActive = () => LS.set("wk.active", state.active);

let toastT;
function toast(msg, ms = 2200) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }

/* ---------- Utilidades de datos ---------- */
const sessionVolume = s => s.exercises.filter(e => !isTime(e)).reduce((a, e) => a + e.sets.filter(x => x.done).reduce((b, x) => b + (+x.w || 0) * (+x.r || 0), 0), 0);
/* Trabajo de una sesión: reps (ejercicios de reps), segundos (de tiempo) y kg de lastre×reps */
const sessionWork = s => s.exercises.reduce((a, e) => { e.sets.filter(x => x.done).forEach(x => { if (isTime(e)) a.secs += +x.r || 0; else { const n = (+x.r || 0) + (sideReps(e) ? (+R2(x) || 0) : 0); a.reps += n; a.kg += (+x.w || 0) * n; } }); return a; }, { reps: 0, secs: 0, kg: 0 });
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")} h` : `${m} min`; };
const fmtWork = w => [`${w.reps} reps`, w.secs ? fmtSec(w.secs) + " " + T("isométricos") : "", w.kg ? fmtVol(w.kg) : ""].filter(Boolean).join(" · ");
const doneSets = s => s.exercises.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
const sortedSessions = () => [...state.sessions].sort((a, b) => b.start - a.start);
function lastSetsFor(ref) {
  const key = typeof ref === "string" ? ref.trim().toLowerCase() : exKey(ref);
  for (const s of sortedSessions()) {
    const e = s.exercises.find(x => exKey(x) === key);
    if (e) { const d = e.sets.filter(x => x.done); if (d.length) return d; }
  }
  return null;
}
const APP_VERSION = "3.5.1";
const THEMES = [["protector", "Protector", "Oscuro cálido, sin azul"], ["dark", "Oscuro", "Neutro"], ["light", "Claro", "Para el día"], ["auto", "Automático", "Sigue al sistema"]];
const curTheme = () => document.documentElement.dataset.theme || "auto";
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  const m = document.getElementById("themeColor"); if (m && bg) m.setAttribute("content", bg);
}
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (curTheme() === "auto") applyTheme("auto"); }); } catch {}
function timeNames() {
  const set = new Set();
  [...state.routines, ...state.sessions].forEach(x => x.exercises.forEach(e => { if (e.type === "time") set.add(e.name.trim().toLowerCase()); }));
  return set;
}
function typeFor(name) { return timeNames().has(name.trim().toLowerCase()) ? "time" : "reps"; }
/* Corrige rutinas y sesión en curso creadas sin tipo (versiones antiguas) */
function migrateTypes() {
  const tn = timeNames(); let chR = false, chA = false;
  state.routines.forEach(r => r.exercises.forEach(e => { if (!e.type) { e.type = tn.has(e.name.trim().toLowerCase()) ? "time" : "reps"; chR = true; } }));
  const sideName = e => SIDE_RX.test(e.name);
  state.routines.forEach(r => r.exercises.forEach(e => { if (e.sides === undefined) { e.sides = sideName(e); chR = true; } }));
  state.active?.exercises?.forEach(e => { if (e.sides === undefined) { e.sides = sideName(e); chA = true; } });
  state.active?.exercises?.forEach(e => { if (!e.type) { e.type = tn.has(e.name.trim().toLowerCase()) ? "time" : "reps"; chA = true; } });
  state.routines.forEach(r => { if (!r.block) { r.block = guessBlock(r.name); chR = true; } });
  state.routines.forEach(r => {
    if (r.variant === undefined) { r.variant = guessVariant(r.name); chR = true; }
    if (!Array.isArray(r.days)) { const g = guessDays(r.name); r.days = g.length ? g : r.block === "diaria" ? [0, 1, 2, 3, 4, 5, 6] : []; chR = true; }
  });
  if (chR) LS.set("wk.routines", state.routines);
  // Objetivos semanales: quien ya tenía una rutina Diaria conserva los de antes (7 y 4)
  if (LS.get("wk.goals", null) === null && state.routines.length) LS.set("wk.goals", state.routines.some(r => r.block === "diaria") ? { daily: 7, strength: 4 } : { daily: 0, strength: 0 });
  if (chA) saveActive();
}
const SIDE_RX = /por lado|per costat|per side|each side/i;
/* ---------- Plan de progresión (rotación de variantes + descarga) ---------- */
const VCOL = ["#D99A52", "#93AF62", "#7FA7C9", "#C98FB8", "#D4C25E", "#8FC4B7", "#E08A70", "#B5A48C"];
const DAY_RX = [[1, /lunes|dilluns|monday|\bmon\b/i], [2, /martes|dimarts|tuesday|\btue\b/i], [3, /mi[eé]rcoles|dimecres|wednesday|\bwed\b/i],
  [4, /jueves|dijous|thursday|\bthu\b/i], [5, /viernes|divendres|friday|\bfri\b/i], [6, /s[aá]bado|dissabte|saturday|\bsat\b/i], [0, /domingo|diumenge|sunday|\bsun\b/i]];
const guessDays = name => DAY_RX.filter(([, rx]) => rx.test(name || "")).map(([d]) => d);
const guessVariant = name => { const m = /^\s*([A-Z0-9]{1,3})\s*[·:\-–|]/.exec(name || ""); return m ? m[1] : ""; };
const normVar = v => String(v || "").trim().toUpperCase().slice(0, 6);
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];           // lunes primero
const dayShort = d => T("L,M,X,J,V,S,D").split(",")[WEEK_ORDER.indexOf(d)];
const PL = { get: () => LS.get("wk.plan", null), save: p => LS.set("wk.plan", p) };
/* Varios planes: uno activo (wk.plan, el que usa Hoy) y los guardados (wk.plans) para activar, duplicar o borrar */
const PLS = { list: () => (LS.get("wk.plans", []) || []).filter(p => p && Array.isArray(p.phases)), save: l => LS.set("wk.plans", l) };
const planName = p => (p?.name || "").trim() || T("Plan");
const planSpan = p => { const ws = planWeeks(p); if (!ws.length) return ""; const a = ws[0].t, z = addDays(ws[ws.length - 1].t, 6), y = new Date(a).getFullYear() !== new Date(z).getFullYear();
  const f = t => new Date(t).toLocaleDateString(LOC(), { day: "numeric", month: "short", ...(y ? { year: "numeric" } : {}) }); return `${f(a)} → ${f(z)} · ${planVariants(p).join(" ")}`; };
function plansBlock() {
  const a = PL.get(), l = PLS.list();
  if (!a && !l.length) return "";
  return `<details class="panel" style="margin-top:12px"${state.plansOpen ? " open" : ""} data-plans><summary style="cursor:pointer;font-weight:600">${T("Mis planes")} · ${(a ? 1 : 0) + l.length}</summary>
    ${a ? `<div class="plr"><div style="flex:1;min-width:0"><b>${esc(planName(a))}</b> <span class="tagb">${T("Activo")}</span><div class="muted" style="font-size:.8rem">${planSpan(a)}</div></div></div>` : ""}
    ${l.map(p => `<div class="plr"><div style="flex:1;min-width:0"><b>${esc(planName(p))}</b><div class="muted" style="font-size:.8rem">${planSpan(p)}</div></div>

/* Avisos durante el entreno: sonido y vibración, solo uno, o nada (wk.fx) */
const FX = [["both", "Sonido y vibración"], ["sound", "Solo sonido"], ["vib", "Solo vibración"], ["off", "Desactivados"]];
const fxMode = () => { const v = LS.get("wk.fx", "both"); return FX.some(f => f[0] === v) ? v : "both"; };
/* ---------- Secciones y grupos (2.5) ----------
   Rutina: secs [{id, name}] (opcional, en orden) y groups {id: {kind: "sup"|"cir", rounds, rest, restAfter}}.
   Ejercicio: sec (id de sección) y grp (id de grupo). Los de un grupo van seguidos, en la misma sección,
   y hacen tantas series como vueltas: A1 → A2 → descanso entre vueltas → A1… */
const GKIND = { sup: "Superserie", cir: "Circuito" };
const SEC_PRESET = ["Calentamiento", "Principal", "Core", "Vuelta a la calma"];
const grpLabel = g => T(GKIND[g?.kind] || "Superserie");
function normRoutine(r) {
  const secs = (r.secs || []).filter(x => x && x.id), g = r.groups || {};
  if (secs.length) {
    const ord = Object.fromEntries(secs.map((x, i) => [x.id, i]));
    r.exercises.forEach(e => { if (!(e.sec in ord)) e.sec = secs[0].id; });
    r.exercises = r.exercises.map((e, i) => [e, i]).sort((a, b) => ord[a[0].sec] - ord[b[0].sec] || a[1] - b[1]).map(x => x[0]);
  } else r.exercises.forEach(e => delete e.sec);
  const out = [], placed = new Set();
  r.exercises.forEach(e => {
    if (e.grp && g[e.grp]) { if (placed.has(e.grp)) return; placed.add(e.grp); r.exercises.filter(x => x.grp === e.grp).forEach(x => { if (secs.length) x.sec = e.sec; out.push(x); }); }
    else { delete e.grp; out.push(e); }
  });
  r.exercises = out;
  Object.keys(g).forEach(id => { const m = out.filter(x => x.grp === id); if (m.length < 2) { m.forEach(x => delete x.grp); delete g[id]; } else { g[id].rounds = Math.max(1, Math.min(20, Math.round(+g[id].rounds || 3))); m.forEach(x => x.sets = g[id].rounds); } });
  if (Object.keys(g).length) r.groups = g; else delete r.groups;
  if (secs.length) r.secs = secs; else delete r.secs;
  return r;
}
/* Letras de orden: A, B… y A1, A2 dentro de una superserie o circuito */
function exKeys(list) {
  const k = []; let L = 0, last = null, n = 0;
  const ch = i => (i >= 26 ? String.fromCharCode(64 + Math.floor(i / 26)) : "") + String.fromCharCode(65 + i % 26);
  list.forEach(e => { if (e.grp && e.grp === last) k.push(ch(L - 1) + (++n)); else if (e.grp) { L++; last = e.grp; n = 1; k.push(ch(L - 1) + 1); } else { L++; last = null; k.push(ch(L - 1)); } });
  return k;
}
/* Duración aproximada (min): reps a ~3 s, más descansos */
function routineMins(r) {
  let t = 0; const seen = new Set(), L = r.exercises;
  L.forEach((e, i) => {
    const work = (+e.reps || 0) * (isTime(e) ? 1 : 3) * (e.sides ? 2 : 1), g = e.grp && r.groups?.[e.grp];
    if (g) { t += g.rounds * (work + (+e.rest || 0)); if (!seen.has(e.grp)) { seen.add(e.grp); t += Math.max(0, g.rounds - 1) * (+g.rest || 0) + (g.restAfter ?? defRestX()); } }
    else { const n = Math.max(1, +e.sets || 1); t += n * work + (n - 1) * restFor(e) + (i < L.length - 1 ? restXFor(e) : 0); }
  });
  return Math.max(1, Math.round(t / 60));
}
const isWarmSec = n => /calent|escalf|warm|calma|cool/i.test(n || "");

/* ---------- Asistente de progresión (2.0) ----------
   A) Propuestas por rendimiento (con el catálogo: usa sus cadenas de pasos). Al terminar una sesión, para cada ejercicio vinculado de la rutina:
      ▲ subir de paso si todas las series llegan al objetivo en N sesiones seguidas; ▼ volver al paso anterior si la media queda
      por debajo del X % del objetivo en M sesiones seguidas. Siempre es una propuesta: Cambiar en la rutina / Más tarde / No proponer.
   B) Plan por fases: en la semana ↑ (vuelve una variante) se aplica sola la regla del plan (p.upRule) a las rutinas de esa variante,
      con un aviso en Hoy que permite deshacer. Esas rutinas no reciben propuestas de subir; las de retroceder, sí.
   Se guarda: wk.prog (ajustes), wk.progMute (rutina:ejercicio sin propuestas), wk.progLog (cambios de paso), wk.planUpDone, wk.planUpLog. */
const PROG = () => ({ on: true, up: 2, down: "60-2", ...(LS.get("wk.prog", {}) || {}) });
const DOWN_OPTS = [["60-2", "Por debajo del 60 % · 2 sesiones"], ["50-3", "Por debajo del 50 % · 3 sesiones"], ["never", "Nunca"]];
const UP_RULES = [["mark", "Solo recordatorio (↑)"], ["reps1", "+1 repetición por serie (+5 s)"], ["reps2", "+2 repeticiones por serie (+10 s)"], ["set", "+1 serie"], ["step", "Siguiente paso si llegaste al objetivo"]];
const upRuleOf = p => UP_RULES.some(u => u[0] === p?.upRule) ? p.upRule : "mark";
/* Rutina con subida automática del plan (variante del plan activo y regla distinta de «solo recordatorio») */
const planAutoUp = r => { const p = PL.get(); return !!(p && p.enabled !== false && p.up && upRuleOf(p) !== "mark" && normVar(r.variant) && planVariants(p).includes(normVar(r.variant))); };

/* Plan: regla de la semana ↑ */
function applyUpRule(rule, r, e) {
  const tm = isTime(e), a = { ...e };
  if (rule === "reps1" || rule === "reps2") { const n = (rule === "reps1" ? 1 : 2) * (tm ? 5 : 1); a.reps = Math.min(tm ? 3600 : 100, (+e.reps || 0) + n); }

en: {
  title: "Training and habits analysis · Usus",
  intro: fem => `You are a strength and calisthenics coach with a solid grounding in exercise physiology, recovery and habits${fem ? ", and knowledge of the menstrual cycle and how it relates to performance" : ""}. Below are one person's records exported from Usus, a training app that keeps data only on their phone. Analyse them and write a useful report.`,

  rules: fem => [
    `You are not a doctor and this is not a diagnosis. Don't diagnose or name conditions from the data. If something deserves a check-up (recurring pain, fast or unintended weight loss, badly disrupted sleep${fem ? ", very irregular cycles, very heavy periods or missed periods" : ""}…), say so clearly and recommend seeing a health professional.`,
    "Read everything in light of the profile and history: the same numbers mean different things for someone with years of training than for a beginner or someone with an injury. Adjust demands and recommendations accordingly.",

    "Not logging doesn't always mean not doing: if there are gaps, keep that in mind and don't draw strong conclusions from them.",

    "Write in English, in a clear and friendly tone."],

    "If you can't make charts, use compact tables or text bars (▁▂▃▄▅▆▇█) instead.",

    "**Summary**: 3–5 key points.",

const XL = () => XT[LANG] || XT.es;
/* ---------- Análisis con IA externa y datos en CSV (2.1) ----------
   Usus no envía nada: genera un texto (prompt + datos) que la persona copia o comparte, o un .zip con tablas CSV.
   Datos para el análisis (opcionales, por perfil): wk.aiProf = {birth, height, level, years, injuries, pains, conditions, meds, goals, other}.
   Solo se guardan si se marca «Guardar para próximas exportaciones»; en el texto sale la edad, nunca la fecha de nacimiento. */
const AI_LEVELS = [["new", "Empiezo (menos de 6 meses)"], ["basic", "Básico (6 meses–2 años)"], ["mid", "Intermedio (2–5 años)"], ["adv", "Avanzado (más de 5 años o competición)"]];
const AI_INC = [["train", "Entrenos, rutinas y plan"], ["weight", "Peso"], ["sleep", "Sueño"], ["supp", "Suplementos"], ["act", "Pasos y actividades"], ["notes", "Notas y etiquetas del diario"], ["cycle", "Ciclo (reglas y síntomas)"]];
const AI_F = [["years", "Detalle de la experiencia y otros deportes", "Ej. 2 años de calistenia, antes fútbol", 0], ["injuries", "Lesiones o cirugías previas", "Ej. rotura de menisco izquierdo (2019)", 1],
  ["pains", "Dolores o molestias actuales", "Ej. lumbar al levantarme por la mañana", 1], ["conditions", "Condiciones de salud relevantes", "Ej. asma, hipertensión, embarazo…", 1],
  ["meds", "Medicación relevante", "Solo si influye en el entreno o la recuperación", 0], ["goals", "Objetivos", "Ej. 10 dominadas, perder 3 kg, dormir mejor", 1], ["other", "Otros", "Lo que quieras que la IA tenga en cuenta", 1]];
const aiProf = () => LS.get("wk.aiProf", null);
const ageOf = b => { if (!/^\d{4}-\d{2}-\d{2}$/.test(b || "")) return null; const d = new Date(b), n = new Date(); let a = n.getFullYear() - d.getFullYear(); if (n.getMonth() < d.getMonth() || (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) a--; return a > 0 && a < 120 ? a : null; };
const hmOf = t => { const d = new Date(t); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const cycAvail = () => curProf().sex !== "m" && CYC.list().length > 0;
function aiFields(f, pre, noBasic) {
  const v = k => esc(f[k] || "");

function weightBanner() {
  const now = Date.now(), wd = W.day(), today = new Date(now).getDay();
  const wk = weekStart(now), dueIdx = (wd + 6) % 7, todayIdx = (today + 6) % 7;
  if (LS.get("wk.weighOn", true) === false) return "";

  if (todayIdx < dueIdx || LS.get("wk.weightSkip", 0) === wk) return "";
  if (W.list().some(x => x.t >= addDays(wk, dueIdx))) return "";
  const last = W.list().slice(-1)[0];
  return prow("var(--accent)", T("Peso semanal"), `${today === wd ? T("Hoy toca pesarte") : T("Pendiente desde el {d}", { d: DIAS[wd] })}${last ? ` · ${T("último")}: ${fmtW(last.kg)}` : ""}`,

/* Pie del ejercicio: acción principal según el momento y navegación.

function exFooter(a, cur, n) {

function bestOf(e, mode) {
  if (mode === "load") return Math.max(...e.sets.map(x => e1rm(x.w, x.r)));

function exerciseProgress(key, name) {
  name = name || key;
  const found = [...state.sessions].sort((a, b) => a.start - b.start)
    .map(s => ({ t: s.start, e: s.exercises.find(x => exKey(x) === key) })).filter(p => p.e);
  // Modo: tiempo (segundos), peso corporal (reps) o con carga (1RM estimado)
  let mode = found.some(p => isTime(p.e)) ? "time" : found.some(p => p.e.sets.some(x => +x.w > 0)) ? "load" : "reps";
  if (mode === "reps" && found.some(p => p.e.sides)) mode = "sides";
  const nd = noteDays();
  const pts = found.map(({ t, e }) => {
    const best = mode === "load" ? Math.max(...e.sets.map(x => e1rm(x.w, x.r))) : Math.max(...e.sets.map(x => +x.r || 0));
    const best2 = Math.max(...e.sets.map(x => +R2(x) || 0));
    const total = mode === "load" ? e.sets.reduce((a, x) => a + x.w * x.r, 0) : e.sets.reduce((a, x) => a + (+x.r || 0), 0);
    const maxW = Math.max(...e.sets.map(x => +x.w || 0));
    return { t, best, best2, total, maxW, note: (e.note || "").trim(), from: e.from || "" };
  });
  const nlist = [...pts].reverse().filter(p => p.note || p.from).slice(0, 8);
  const notesHtml = nlist.length ? `<p class="muted" style="margin:12px 0 0;font-size:.85rem">${T("Notas de este ejercicio")}</p><ul class="exnl">${nlist.map(p => `<li><span class="d">${new Date(p.t).toLocaleDateString(LOC(), { day: "numeric", month: "short" })}</span><span>${p.from ? `⇄ ${T("en lugar de {x}", { x: esc(p.from) })}` : ""}${p.from && p.note ? " · " : ""}${p.note ? `✎ ${esc(p.note)}` : ""}</span></li>`).join("")}</ul>` : "";
  const prB = Math.max(...pts.map(p => p.best)), prT = Math.max(...pts.map(p => p.total)), prW = Math.max(...pts.map(p => p.maxW));
  const M = {
    load: { unit: v => `${fmtKg(v)} kg`, label: T("1RM estimado (fórmula de Epley) por sesión"), cells: [[`${fmtKg(prW)} kg`, T("Peso máximo")], [`${fmtKg(prB)} kg`, T("1RM estimado")], [fmtVol(prT), T("Mejor volumen")]] },
    sides: { unit: v => `${Math.round(v)} reps`, label: T("Mejor serie por lado (reps) por sesión"), cells: [[`${prB}`, T("Mejor izq.")], [`${Math.max(...pts.map(p => p.best2))}`, T("Mejor der.")], [`${pts.length}`, T("Sesiones")]] },
    reps: { unit: v => `${Math.round(v)} reps`, label: T("Mejor serie (repeticiones) por sesión"), cells: [[`${prB}`, T("Mejor serie (reps)")], [`${prT}`, T("Más reps en una sesión")], [`${pts.length}`, T("Sesiones")]] },
    time: { unit: v => fmtSec(v), label: T("Mejor serie (segundos) por sesión"), cells: [[fmtSec(prB), T("Mejor serie")], [fmtSec(prT), T("Más tiempo en una sesión")], [prW ? `${fmtKg(prW)} kg` : `${pts.length}`, prW ? T("Lastre máximo") : T("Sesiones")]] }
  }[mode];
  const prs = `<div class="prs">${M.cells.map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`;
  if (pts.length < 2) return `<p class="muted" style="margin:14px 0 0">${T("Registra este ejercicio en al menos dos sesiones para ver la evolución.")}</p>${prs}${notesHtml}`;

  const W = 640, H = 220, pl = 40, pr = 12, pt = 16, pb = 28;
  const ys = mode === "sides" ? pts.flatMap(p => [p.best, p.best2]) : pts.map(p => p.best);
  let lo = Math.min(...ys) * 0.95, hi = Math.max(...ys) * 1.03 || 1;
  if (hi - lo < 4) { const mid = (Math.min(...ys) + Math.max(...ys)) / 2; lo = Math.max(0, mid - 2); hi = lo + 4; } // evita ejes con valores repetidos
  const X = i => pl + (i / (pts.length - 1)) * (W - pl - pr);
  const Y = v => pt + (1 - (v - lo) / (hi - lo || 1)) * (H - pt - pb);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(M.label)}: ${esc(name)}">`;
  for (let k = 0; k <= 3; k++) {
    const v = lo + (hi - lo) * k / 3, y = Y(v);
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${Math.round(v)}</text>`;
  }
  svg += `<polyline fill="none" stroke-width="2.5" stroke-linejoin="round" style="stroke:var(--accent)" points="${pts.map((p, i) => `${X(i)},${Y(p.best)}`).join(" ")}"/>`;
  if (mode === "sides") {
    svg += `<polyline fill="none" stroke-width="2.5" stroke-dasharray="6 5" stroke-linejoin="round" style="stroke:var(--ink)" points="${pts.map((p, i) => `${X(i)},${Y(p.best2)}`).join(" ")}"/>`;
    pts.forEach((p, i) => { svg += `<circle cx="${X(i)}" cy="${Y(p.best2)}" r="4" style="fill:var(--surface);stroke:var(--ink)" stroke-width="2"><title>${new Date(p.t).toLocaleDateString(LOC())} · ${T("der.")} ${p.best2} reps</title></circle>`; });
  }
  pts.forEach((p, i) => {
    const d = new Date(p.t);
    svg += `<circle cx="${X(i)}" cy="${Y(p.best)}" r="4" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2"><title>${d.toLocaleDateString(LOC())} · ${M.unit(p.best)}</title></circle>`;
  });
  const idx = pts.length <= 6 ? pts.map((_, i) => i) : [0, Math.floor(pts.length / 3), Math.floor(2 * pts.length / 3), pts.length - 1];
  idx.forEach(i => { const d = new Date(pts[i].t); svg += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${d.getDate()} ${MESES[d.getMonth()]}</text>`; });
  pts.forEach((p, i) => { const k = dayKey(p.t); if (nd.has(k)) svg += noteDot(X(i), Math.max(8, Y(p.best) - 13), [k]); });
  svg += "</svg>";
  const legend = mode === "sides" ? `<p class="muted" style="margin:6px 0 0;font-size:.8rem"><span style="color:var(--accent)">━</span> ${T("Izquierdo")} · <span style="color:var(--ink)">╍</span> ${T("Derecho")}</p>` : "";
  return `<p class="muted" style="margin:14px 0 6px;font-size:.85rem">${M.label}</p><div class="chart">${svg}</div>${legend}${prs}${notesHtml}`;
}

(async () => {
  setLang(detectLang());
  renderTabs();
  await store.init();
  const data = await store.load();
  state.routines = data.routines; state.sessions = data.sessions;
  migrateStored(); migrateTypes(); planMigrateOrder();
  applyTheme(curTheme());
  restorePlace();
  // Versión nueva: un aviso breve que se oculta solo; las novedades, en Ajustes → Acerca de
  if (LS.get("wk.welcomed", false) && LS.get("wk.seenVersion", null) !== APP_VERSION) { LS.set("wk.seenVersion", APP_VERSION); setTimeout(() => toast(T("Usus se ha actualizado a la versión {v}. Novedades en Ajustes → Acerca de.", { v: APP_VERSION }), 5000), 800); }
  if (LS.get("wk.catalog", null) === null) state.catAsk = true;
  if (catOn()) loadCatalog().then(c => { planUpCheck(); render(); }); else planUpCheck();
  render();
  await readShareHash();
  readShareTarget();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
})();
